apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ehf-runtime-worker
spec:
  scaleTargetRef:
    name: ehf-runtime-worker
  pollingInterval: 15
  cooldownPeriod: 120
  minReplicaCount: 1
  maxReplicaCount: 20
  fallback:
    failureThreshold: 3
    replicas: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    - type: postgresql
      metadata:
        connectionFromEnv: KEDA_DATABASE_URL
        targetQueryValue: "4"
        activationTargetQueryValue: "1"
        # Claimable runs, counted the way the dispatcher claims them (expired leases
        # included). KEDA_DATABASE_URL should be a login in ehf_svc_queue_metrics, which
        # may call this function and read nothing else (044_queue_metrics.sql).
        query: select harness_runtime.ready_run_count()
