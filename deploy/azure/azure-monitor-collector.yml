receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  transform/platform_metadata:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.namespace", "service.version", "deployment.environment.name", "cloud.region", "harness.telemetry.classification"])
      - context: span
        statements:
          - keep_keys(attributes, ["harness.run_id", "harness.attempt", "harness.step_id", "harness.workflow_id", "harness.outcome", "harness.capability_id", "harness.adapter", "error.type", "http.request.method", "http.response.status_code", "gen_ai.system", "gen_ai.provider.name", "gen_ai.operation.name", "gen_ai.request.model", "gen_ai.response.model", "gen_ai.response.id", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens", "ehf.telemetry.probe.id"])
          - set(status.message, "")
      - context: spanevent
        statements:
          - keep_keys(attributes, ["exception.type"])
  batch:
    send_batch_size: 128
    send_batch_max_size: 256
    timeout: 3s
exporters:
  azuremonitor:
    connection_string: ${env:APPLICATIONINSIGHTS_CONNECTION_STRING}
    sending_queue:
      enabled: true
      queue_size: 64
      num_consumers: 2
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/platform_metadata, batch]
      exporters: [azuremonitor]
