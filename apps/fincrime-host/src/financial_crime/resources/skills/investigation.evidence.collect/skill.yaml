output_schema:
  $defs:
    CollectedEvidence:
      additionalProperties: false
      properties:
        content_hash:
          $ref: '#/$defs/Hash'
        id:
          $ref: '#/$defs/Id'
        ref:
          $ref: '#/$defs/Ref'
        source_id:
          $ref: '#/$defs/Id'
      required:
      - id
      - source_id
      - content_hash
      - ref
      type: object
    Hash:
      pattern: ^[a-f0-9]{64}$
      type: string
    Id:
      maxLength: 512
      minLength: 1
      type: string
    Ref:
      additionalProperties: false
      properties:
        object_id:
          $ref: '#/$defs/Id'
        object_type:
          $ref: '#/$defs/Id'
        schema_version:
          $ref: '#/$defs/Semver'
          default: 2.0.0
        tenant_id:
          $ref: '#/$defs/Id'
        version_id:
          $ref: '#/$defs/Id'
      required:
      - tenant_id
      - object_type
      - object_id
      - version_id
      type: object
    Semver:
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$
      type: string
  $id: urn:financial-crime:skill:investigation.evidence.collect:output:0.3.0
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    collected:
      items:
        $ref: '#/$defs/CollectedEvidence'
      maxItems: 10000
      type: array
  required:
  - collected
  type: object
