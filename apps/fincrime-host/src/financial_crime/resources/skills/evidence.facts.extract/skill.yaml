        evidence_ids:
          items:
            $ref: '#/$defs/Id'
          maxItems: 10000
          type: array
        method:
          $ref: '#/$defs/Id'
        status:
          $ref: '#/$defs/Id'
        verified_at:
          $ref: '#/$defs/Timestamp'
      required:
      - status
      - method
      type: object
