output_schema:
  $defs:
    EvidenceBundleItem:
      additionalProperties: false
      properties:
        hash:
          $ref: '#/$defs/Hash'
        ref:
          $ref: '#/$defs/Ref'
        source_id:
          $ref: '#/$defs/Id'
      required:
      - ref
      - hash
      - source_id
      type: object
    Hash:
      pattern: ^[a-f0-9]{64}$
      type: string
    Id:
      maxLength: 512
      minLength: 1
      type: string
    Ref:
      additionalProperties: false
      properties:
        object_id:
          $ref: '#/$defs/Id'
        object_type:
          $ref: '#/$defs/Id'
        schema_version:
          $ref: '#/$defs/Semver'
          default: 2.0.0
        tenant_id:
          $ref: '#/$defs/Id'
        version_id:
          $ref: '#/$defs/Id'
      required:
      - tenant_id
      - object_type
      - object_id
      - version_id
      type: object
    Semver:
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$
      type: string
  $id: urn:financial-crime:skill:evidence.bundle.compile:output:0.3.0
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    bundle_hash:
      $ref: '#/$defs/Hash'
    manifest:
      items:
        $ref: '#/$defs/EvidenceBundleItem'
      maxItems: 10000
      type: array
  required:
  - manifest
  - bundle_hash
  type: object
