input_schema:
  $defs:
    Decimal:
      pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$
      type: string
    Extension:
      additionalProperties: false
      properties:
        schema_version:
          $ref: '#/$defs/Semver'
        source_ref:
          anyOf:
          - $ref: '#/$defs/Ref'
          - type: 'null'
        value:
          $ref: '#/$defs/JsonValue'
      required:
      - schema_version
      - value
      type: object
    Extensions:
      additionalProperties:
        $ref: '#/$defs/Extension'
      propertyNames:
        pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
        type: string
      type: object
      x-dynamic-map-reason: explicit versioned source/institution extensions
    FilingData:
      additionalProperties: false
      properties:
        citations:
          items:
            $ref: '#/$defs/Id'
          maxItems: 10000
          type: array
        extensions:
          $ref: '#/$defs/Extensions'
        narrative:
          $ref: '#/$defs/Text'
        report_type:
          $ref: '#/$defs/ReportType'
        subject_id:
          $ref: '#/$defs/Id'
        totals:
          additionalProperties:
            $ref: '#/$defs/Decimal'
          type: object
          x-dynamic-map-reason: keyed collection
      required:
      - report_type
      - subject_id
      type: object
    Id:
      maxLength: 512
      minLength: 1
      type: string
    JsonValue:
      anyOf:
      - type: 'null'
      - type: boolean
      - maxLength: 200000
        type: string
      - type: number
      - items:
          $ref: '#/$defs/JsonValue'
        maxItems: 10000
        type: array
      - additionalProperties:
          $ref: '#/$defs/JsonValue'
        type: object
        x-dynamic-map-reason: raw JSON source value
    Ref:
      additionalProperties: false
      properties:
        object_id:
          $ref: '#/$defs/Id'
        object_type:
          $ref: '#/$defs/Id'
        schema_version:
          $ref: '#/$defs/Semver'
          default: 2.0.0
        tenant_id:
          $ref: '#/$defs/Id'
        version_id:
          $ref: '#/$defs/Id'
      required:
      - tenant_id
      - object_type
      - object_id
      - version_id
      type: object
    ReportType:
      enum:
      - SAR
      - CTR
    Semver:
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$
      type: string
    Text:
      maxLength: 200000
      type: string
  $id: urn:financial-crime:skill:regulatory.filing.submit:input:0.3.0
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    filing:
