      - source
      - target
      - amount
      - currency
      - timestamp
      - event_id
      - status
      - _ref
      - _synthetic
      - source_account
      - target_account
      type: object
    Id:
      maxLength: 512
      minLength: 1
      type: string
    Ref:
      additionalProperties: false
      properties:
        object_id:
          $ref: '#/$defs/Id'
        object_type:
          $ref: '#/$defs/Id'
        schema_version:
          $ref: '#/$defs/Semver'
