      - tenant_id
      - object_type
      - object_id
      - version_id
      type: object
    Semver:
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$
      type: string
    Timestamp:
      format: date-time
      type: string
    TransactionStatus:
      enum:
      - settled
      - pending
      - reversed
      - cancelled
