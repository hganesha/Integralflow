      propertyNames:
        pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
        type: string
      type: object
      x-dynamic-map-reason: explicit versioned source/institution extensions
    Id:
      maxLength: 512
      minLength: 1
      type: string
    JsonValue:
      anyOf:
      - type: 'null'
      - type: boolean
      - maxLength: 200000
        type: string
      - type: number
      - items:
          $ref: '#/$defs/JsonValue'
        maxItems: 10000
        type: array
      - additionalProperties:
          $ref: '#/$defs/JsonValue'
        type: object
        x-dynamic-map-reason: raw JSON source value
    PartyProfile:
      additionalProperties: false
      properties:
        business_purpose:
          $ref: '#/$defs/Text'
        employees:
          $ref: '#/$defs/Count'
        entity_id:
          $ref: '#/$defs/Id'
        extensions:
          $ref: '#/$defs/Extensions'
        legal_name:
          $ref: '#/$defs/Id'
        party_id:
          $ref: '#/$defs/Id'
        role:
          $ref: '#/$defs/Id'
      required:
      - party_id
      - entity_id
      - role
      type: object
    Ref:
      additionalProperties: false
      properties:
        object_id:
          $ref: '#/$defs/Id'
        object_type:
          $ref: '#/$defs/Id'
        schema_version:
          $ref: '#/$defs/Semver'
          default: 2.0.0
        tenant_id:
          $ref: '#/$defs/Id'
        version_id:
          $ref: '#/$defs/Id'
      required:
      - tenant_id
      - object_type
      - object_id
      - version_id
      type: object
    Semver:
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$
      type: string
    Text:
      maxLength: 200000
      type: string
