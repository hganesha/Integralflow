limitations:
- This package is an implemented synthetic reference, not a qualified production service.
  Its scope is the behavior stated above and the typed input/output contracts. Independent
  representative evaluation, approved institution policy and supported source mappings
  remain required. No independent real-source accuracy or institution-specific acceptance
  authority is established by the bundled examples. The rule's `amount_threshold`
  is stated in its one `currency`; no exchange rate is pinned, so a transaction in
  another currency is listed as not evaluated rather than converted or compared in
  its own units, and an institution with activity in several currencies has those
  transactions reported as gaps until a rule exists for them.
