    ThroughputIndicator:
      additionalProperties: false
      properties:
        account:
          $ref: '#/$defs/Id'
        allocation:
          $ref: '#/$defs/Id'
        currency:
          $ref: '#/$defs/Id'
        kind:
          $ref: '#/$defs/Id'
        transaction_ids:
          items:
            $ref: '#/$defs/Id'
          maxItems: 10000
          type: array
      required:
      - account
      - currency
      - transaction_ids
      - kind
      - allocation
      type: object
    TypologyIndicator:
      oneOf:
      - $ref: '#/$defs/CountIndicator'
      - $ref: '#/$defs/ThroughputIndicator'
      - $ref: '#/$defs/PathIndicator'
    TypologyResult:
      additionalProperties: false
      properties:
        indicators:
          items:
            $ref: '#/$defs/TypologyIndicator'
          maxItems: 10000
          type: array
        typology:
          $ref: '#/$defs/Id'
      required:
      - typology
      - indicators
      type: object
