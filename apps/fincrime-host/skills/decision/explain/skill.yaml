  additionalProperties: false
  properties:
    explanation:
      items:
        $ref: '#/$defs/ControlRow_outcome_requirement_id'
      maxItems: 10000
      type: array
    policy_hash:
      $ref: '#/$defs/Hash'
  required:
  - explanation
  - policy_hash
  type: object
