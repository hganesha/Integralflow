input_schema:
  $id: urn:financial-crime:skill:decision.recommendation.generate:input:0.3.0
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties: {}
  required: []
  type: object
instruction_hash: e379bbc537a82db52790a8d9e7d95b03e611d1fb128a0f06555a4e05266911da
instructions: SKILL.md
jurisdiction_scope:
- synthetic-neutral
limitations:
- Bounded mapping over admitted controls, not complete applicability/requirement evaluation
  or final disposition. Parent gates must establish completeness and current control
  basis. Current maturity remains implemented_synthetic. Independent evaluation, policy/source
  approvals and operating qualification are required before production.
maturity: implemented_synthetic
optional_context: []
output_schema:
  $defs:
    Bool:
      type: boolean
    ControlRow_outcome_requirement_id:
      additionalProperties: false
      properties:
        _ref:
          $ref: '#/$defs/Ref'
        _synthetic:
          $ref: '#/$defs/Bool'
        id:
          $ref: '#/$defs/Id'
        outcome:
          $ref: '#/$defs/Outcome'
        requirement_id:
          $ref: '#/$defs/Id'
      required:
      - id
      - outcome
      - requirement_id
      - _ref
      - _synthetic
      type: object
    Id:
      maxLength: 512
      minLength: 1
      type: string
    Outcome:
      enum:
      - PASS
      - FAIL
      - UNKNOWN
      - NOT_APPLICABLE
    Ref:
      additionalProperties: false
      properties:
        object_id:
          $ref: '#/$defs/Id'
        object_type:
          $ref: '#/$defs/Id'
        schema_version:
          $ref: '#/$defs/Semver'
          default: 2.0.0
        tenant_id:
          $ref: '#/$defs/Id'
        version_id:
          $ref: '#/$defs/Id'
      required:
      - tenant_id
      - object_type
      - object_id
      - version_id
      type: object
    Semver:
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$
      type: string
  $id: urn:financial-crime:skill:decision.recommendation.generate:output:0.3.0
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    reasons:
      items:
        $ref: '#/$defs/ControlRow_outcome_requirement_id'
      maxItems: 10000
      type: array
    recommendation:
      maxLength: 4000
      minLength: 1
      type: string
  required:
  - recommendation
  - reasons
  type: object
owner: financial-crime-skills
permitted_capabilities: []
