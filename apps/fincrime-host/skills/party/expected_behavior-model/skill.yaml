jurisdiction_scope:
- synthetic-neutral
limitations:
- This package is an implemented synthetic reference, not a qualified production service.
  Its scope is the behavior stated above and the typed input/output contracts. Independent
  representative evaluation, approved institution policy and supported source mappings
  remain required. No independent real-source accuracy or institution-specific acceptance
  authority is established by the bundled examples.
maturity: implemented_synthetic
optional_context: []
output_schema:
  $defs:
    Activity:
      additionalProperties: false
      properties:
        count:
          $ref: '#/$defs/Count'
        currency:
          $ref: '#/$defs/Id'
        extensions:
          $ref: '#/$defs/Extensions'
        monthly_amount:
          $ref: '#/$defs/Decimal'
      required: []
      type: object
    Count:
      minimum: 0
      type: integer
    Decimal:
      pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$
      type: string
    ExpectedBaseline:
      additionalProperties: false
      properties:
        id:
          $ref: '#/$defs/Id'
        parameters:
          $ref: '#/$defs/Activity'
        window:
          $ref: '#/$defs/Window'
      required:
      - id
      - parameters
      - window
      type: object
    Extension:
      additionalProperties: false
      properties:
        schema_version:
          $ref: '#/$defs/Semver'
        source_ref:
          anyOf:
          - $ref: '#/$defs/Ref'
          - type: 'null'
        value:
          $ref: '#/$defs/JsonValue'
      required:
      - schema_version
      - value
      type: object
    Extensions:
      additionalProperties:
        $ref: '#/$defs/Extension'
      propertyNames:
        pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
        type: string
      type: object
      x-dynamic-map-reason: explicit versioned source/institution extensions
    Id:
      maxLength: 512
      minLength: 1
      type: string
    JsonValue:
      anyOf:
      - type: 'null'
      - type: boolean
      - maxLength: 200000
        type: string
      - type: number
      - items:
          $ref: '#/$defs/JsonValue'
        maxItems: 10000
        type: array
      - additionalProperties:
          $ref: '#/$defs/JsonValue'
        type: object
        x-dynamic-map-reason: raw JSON source value
    Ref:
      additionalProperties: false
      properties:
        object_id:
          $ref: '#/$defs/Id'
        object_type:
          $ref: '#/$defs/Id'
        schema_version:
          $ref: '#/$defs/Semver'
          default: 2.0.0
        tenant_id:
          $ref: '#/$defs/Id'
        version_id:
          $ref: '#/$defs/Id'
      required:
      - tenant_id
      - object_type
      - object_id
      - version_id
      type: object
    Semver:
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$
      type: string
    Timestamp:
      format: date-time
      type: string
    Window:
      additionalProperties: false
      properties:
        end:
          $ref: '#/$defs/Timestamp'
        start:
          $ref: '#/$defs/Timestamp'
      required:
      - start
      - end
      type: object
  $id: urn:financial-crime:skill:party.expected_behavior.model:output:0.3.0
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    baseline:
      items:
        $ref: '#/$defs/ExpectedBaseline'
      maxItems: 10000
      type: array
    inferred:
      type: boolean
  required:
  - baseline
  - inferred
  type: object
