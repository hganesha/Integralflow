      - id
      - claim
      - status
      - evidence_ids
      - _ref
      - _synthetic
      type: object
    FindingStatus:
      enum:
      - RESOLVED
      - UNRESOLVED
      - INDICATOR
      - EXCULPATORY
      - UNVERIFIED
      - DISPUTED
    Id:
      maxLength: 512
      minLength: 1
      type: string
    Ref:
      additionalProperties: false
      properties:
        object_id:
          $ref: '#/$defs/Id'
        object_type:
          $ref: '#/$defs/Id'
        schema_version:
