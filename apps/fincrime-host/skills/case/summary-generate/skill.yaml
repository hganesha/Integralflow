      - optional
      type: object
    Count:
      minimum: 0
      type: integer
    FindingRow_claim_evidence_ids_status:
      additionalProperties: false
      properties:
        _ref:
          $ref: '#/$defs/Ref'
        _synthetic:
          $ref: '#/$defs/Bool'
        claim:
