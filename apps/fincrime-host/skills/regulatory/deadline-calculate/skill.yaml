limitations:
- This package is an implemented synthetic reference, not a qualified production service.
  Its scope is the behavior stated above and the typed input/output contracts. Independent
  representative evaluation, approved institution policy and supported source mappings
  remain required. No independent real-source accuracy or institution-specific acceptance
  authority is established by the bundled examples. Days are counted on the local
  dates of the obligation's `time_zone` and the deadline keeps the event's local wall
  time; a wall time skipped by a daylight-saving change is written as the instant
  it maps to, and a repeated one takes its first occurrence. The BusinessCalendar's
  holidays are read as dates in that zone; it does not state a zone of its own. A
  calendar-day deadline is not moved off a weekend or holiday.
