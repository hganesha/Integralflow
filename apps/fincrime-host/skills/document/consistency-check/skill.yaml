output_schema:
  $defs:
    Bool:
      type: boolean
    ExtractedAssertionRow_document_version_field_subject_value:
      additionalProperties: false
      properties:
        _ref:
          $ref: '#/$defs/Ref'
        _synthetic:
          $ref: '#/$defs/Bool'
        document_version:
          $ref: '#/$defs/Id'
        field:
          $ref: '#/$defs/Id'
        id:
          $ref: '#/$defs/Id'
        subject:
          $ref: '#/$defs/Id'
        value:
          $ref: '#/$defs/JsonValue'
      required:
      - id
      - subject
      - field
      - value
      - document_version
      - _ref
      - _synthetic
      type: object
    Id:
      maxLength: 512
      minLength: 1
      type: string
    JsonValue:
      anyOf:
      - type: 'null'
      - type: boolean
      - maxLength: 200000
        type: string
      - type: number
      - items:
          $ref: '#/$defs/JsonValue'
        maxItems: 10000
        type: array
      - additionalProperties:
          $ref: '#/$defs/JsonValue'
        type: object
        x-dynamic-map-reason: raw JSON source value
    Ref:
      additionalProperties: false
      properties:
        object_id:
          $ref: '#/$defs/Id'
        object_type:
          $ref: '#/$defs/Id'
        schema_version:
          $ref: '#/$defs/Semver'
          default: 2.0.0
        tenant_id:
          $ref: '#/$defs/Id'
        version_id:
          $ref: '#/$defs/Id'
      required:
      - tenant_id
      - object_type
      - object_id
      - version_id
      type: object
    Semver:
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$
      type: string
    SnapshotConflict:
      additionalProperties: false
      properties:
        assertions:
          items:
            $ref: '#/$defs/ExtractedAssertionRow_document_version_field_subject_value'
          maxItems: 10000
          type: array
        field:
          $ref: '#/$defs/Id'
        subject:
          $ref: '#/$defs/Id'
      required:
      - subject
      - field
      - assertions
      type: object
  $id: urn:financial-crime:skill:document.consistency.check:output:0.3.0
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    conflicts:
      items:
        $ref: '#/$defs/SnapshotConflict'
      maxItems: 10000
      type: array
  required:
  - conflicts
  type: object
