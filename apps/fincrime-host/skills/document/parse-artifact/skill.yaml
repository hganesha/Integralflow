input_schema:
  $id: urn:financial-crime:skill:document.parse.artifact:input:0.3.0
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    document_version:
      maxLength: 4000
      minLength: 1
      type: string
  required:
  - document_version
  type: object
instruction_hash: a1d882d750e4ea1490846210f5cbce90ba966a7ad04af5516349c4d881705a5b
instructions: SKILL.md
jurisdiction_scope:
- synthetic-neutral
limitations:
- This package is an implemented synthetic reference, not a qualified production service.
  Its scope is the behavior stated above and the typed input/output contracts. Independent
  representative evaluation, approved institution policy and supported source mappings
  remain required. Uses admitted full-text pages when present; otherwise an admitted
  OCR provider. OCR accuracy is the provider's; local tests use synthetic recordings.
maturity: implemented_synthetic
optional_context:
- fields:
  - text
  - page
  - document_version
  - extensions
  max_age_seconds: null
  min_count: 0
  model_visible: true
  nullable_fields: []
  object_type: DocumentPage
  optional: true
output_schema:
  $defs:
    ArtifactPage:
      additionalProperties: false
      properties:
        document_version:
          $ref: '#/$defs/Id'
        hash:
          $ref: '#/$defs/Hash'
        page:
          $ref: '#/$defs/PositiveCount'
        source_ref:
          $ref: '#/$defs/Ref'
        text:
          $ref: '#/$defs/Text'
        text_basis:
          $ref: '#/$defs/TextBasis'
      required:
      - page
      - document_version
      - text
      - hash
      - text_basis
      - source_ref
      type: object
    Hash:
      pattern: ^[a-f0-9]{64}$
      type: string
    Id:
      maxLength: 512
      minLength: 1
      type: string
    PositiveCount:
      minimum: 1
      type: integer
    Ref:
      additionalProperties: false
      properties:
        object_id:
          $ref: '#/$defs/Id'
        object_type:
          $ref: '#/$defs/Id'
        schema_version:
          $ref: '#/$defs/Semver'
          default: 2.0.0
        tenant_id:
          $ref: '#/$defs/Id'
        version_id:
          $ref: '#/$defs/Id'
      required:
      - tenant_id
      - object_type
      - object_id
      - version_id
      type: object
    Semver:
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$
      type: string
    Text:
      maxLength: 200000
      type: string
    TextBasis:
      enum:
      - full_text
      - ocr
  $id: urn:financial-crime:skill:document.parse.artifact:output:0.3.0
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    complete:
      type: boolean
    document_version:
      maxLength: 4000
      minLength: 1
      type: string
    pages:
      items:
        $ref: '#/$defs/ArtifactPage'
      maxItems: 10000
      type: array
    parser:
      maxLength: 4000
      minLength: 1
      type: string
  required:
  - pages
  - parser
  - complete
  - document_version
  type: object
owner: financial-crime-skills
permitted_capabilities:
- document.ocr
