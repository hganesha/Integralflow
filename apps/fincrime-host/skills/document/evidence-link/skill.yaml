input_schema:
  $defs:
    AssertionStatus:
      const: EXTRACTED_ASSERTION
    Count:
      minimum: 0
      type: integer
    Id:
      maxLength: 512
      minLength: 1
      type: string
    PositiveCount:
      minimum: 1
      type: integer
    Ref:
      additionalProperties: false
      properties:
        object_id:
          $ref: '#/$defs/Id'
        object_type:
          $ref: '#/$defs/Id'
        schema_version:
          $ref: '#/$defs/Semver'
          default: 2.0.0
        tenant_id:
          $ref: '#/$defs/Id'
        version_id:
          $ref: '#/$defs/Id'
      required:
      - tenant_id
      - object_type
      - object_id
      - version_id
      type: object
    Semver:
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$
      type: string
    SpanAssertion:
      additionalProperties: false
      properties:
        document_version:
          $ref: '#/$defs/Id'
        end:
          $ref: '#/$defs/PositiveCount'
        epistemic_status:
          $ref: '#/$defs/AssertionStatus'
        field:
          $ref: '#/$defs/Id'
        page_id:
          $ref: '#/$defs/Id'
        source_ref:
          $ref: '#/$defs/Ref'
        start:
          $ref: '#/$defs/Count'
        value:
          $ref: '#/$defs/Text'
      required:
      - field
      - value
      - page_id
      - document_version
      - start
      - end
      - epistemic_status
      type: object
    Text:
      maxLength: 200000
      type: string
  $id: urn:financial-crime:skill:document.evidence.link:input:0.3.0
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    assertions:
      items:
        $ref: '#/$defs/SpanAssertion'
      maxItems: 10000
      minItems: 0
      type: array
  required:
  - assertions
  type: object
