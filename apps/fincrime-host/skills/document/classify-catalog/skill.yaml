          items:
            $ref: '#/$defs/CatalogCandidate'
          maxItems: 10000
          type: array
        document_type:
          $ref: '#/$defs/Id'
        document_version:
          $ref: '#/$defs/Id'
      required:
      - document_version
      - document_type
      - basis
      - candidates
      type: object
    CatalogMatch:
      additionalProperties: false
      properties:
        end:
          $ref: '#/$defs/PositiveCount'
        page:
          $ref: '#/$defs/PositiveCount'
        quote:
          $ref: '#/$defs/Text'
        start:
          $ref: '#/$defs/Count'
      required:
      - page
      - start
      - end
      - quote
      type: object
    ClassificationBasis:
      enum:
      - title
      - unique_mention
      - ambiguous_or_unmatched
    Count:
      minimum: 0
      type: integer
    Hash:
      pattern: ^[a-f0-9]{64}$
      type: string
    Id:
      maxLength: 512
      minLength: 1
      type: string
    PositiveCount:
      minimum: 1
      type: integer
    Text:
      maxLength: 200000
      type: string
  $id: urn:financial-crime:skill:document.classify.catalog:output:0.3.0
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    catalog_hash:
      $ref: '#/$defs/Hash'
    classifications:
      items:
        $ref: '#/$defs/CatalogClassification'
      maxItems: 10000
      type: array
  required:
  - classifications
  - catalog_hash
  type: object
