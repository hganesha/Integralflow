limitations:
- This package is an implemented synthetic reference, not a qualified production service.
  Its scope is the behavior stated above and the typed input/output contracts. Independent
  representative evaluation, approved institution policy and supported source mappings
  remain required. No independent real-source accuracy or institution-specific acceptance
  authority is established by the bundled examples. Without a page count, missing
  pages after the last admitted page cannot be detected; document.parse.artifact checks
  the count.
maturity: implemented_synthetic
optional_context: []
output_schema:
  $defs:
    Hash:
      pattern: ^[a-f0-9]{64}$
      type: string
    Id:
      maxLength: 512
      minLength: 1
      type: string
    ParsedPage:
      additionalProperties: false
      properties:
        document_version:
          $ref: '#/$defs/Id'
        hash:
          $ref: '#/$defs/Hash'
        page:
          $ref: '#/$defs/PositiveCount'
        source_ref:
          $ref: '#/$defs/Ref'
        text:
          $ref: '#/$defs/Text'
      required:
      - page
      - document_version
      - text
      - hash
      - source_ref
      type: object
    PositiveCount:
      minimum: 1
      type: integer
    Ref:
      additionalProperties: false
      properties:
        object_id:
          $ref: '#/$defs/Id'
        object_type:
          $ref: '#/$defs/Id'
        schema_version:
          $ref: '#/$defs/Semver'
          default: 2.0.0
        tenant_id:
          $ref: '#/$defs/Id'
        version_id:
          $ref: '#/$defs/Id'
      required:
      - tenant_id
      - object_type
      - object_id
      - version_id
      type: object
    Semver:
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$
      type: string
    Text:
      maxLength: 200000
      type: string
  $id: urn:financial-crime:skill:document.parse:output:0.3.0
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    format:
      maxLength: 4000
      minLength: 1
      type: string
    pages:
      items:
        $ref: '#/$defs/ParsedPage'
      maxItems: 10000
      type: array
  required:
  - pages
  - format
  type: object
