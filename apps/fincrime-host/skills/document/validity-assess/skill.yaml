optional_context: []
output_schema:
  $defs:
    DatePrecision:
      enum:
      - day
      - month
      - year
    DocumentValidityAssessment:
      additionalProperties: false
      properties:
        basis:
          items:
            $ref: '#/$defs/Ref'
          maxItems: 10000
          type: array
        document_version:
          $ref: '#/$defs/Id'
        expires:
          $ref: '#/$defs/JsonValue'
        expires_precision:
          anyOf:
          - $ref: '#/$defs/DatePrecision'
          - type: 'null'
        issued:
          $ref: '#/$defs/JsonValue'
        issued_precision:
          anyOf:
          - $ref: '#/$defs/DatePrecision'
          - type: 'null'
        status:
          $ref: '#/$defs/DocumentValidityStatus'
      required:
      - document_version
      - status
      - issued
      - expires
      - issued_precision
      - expires_precision
      - basis
      type: object
    DocumentValidityStatus:
      enum:
      - CURRENT
      - EXPIRED
      - NOT_YET_VALID
      - UNDETERMINED_PRECISION
      - UNREADABLE_DATE
      - EXPIRY_NOT_EXTRACTED
      - CONFLICTING_DATES
    Id:
      maxLength: 512
      minLength: 1
      type: string
    JsonValue:
      anyOf:
      - type: 'null'
      - type: boolean
      - maxLength: 200000
        type: string
      - type: number
      - items:
          $ref: '#/$defs/JsonValue'
        maxItems: 10000
        type: array
      - additionalProperties:
          $ref: '#/$defs/JsonValue'
        type: object
        x-dynamic-map-reason: raw JSON source value
    Ref:
      additionalProperties: false
      properties:
        object_id:
          $ref: '#/$defs/Id'
        object_type:
          $ref: '#/$defs/Id'
        schema_version:
          $ref: '#/$defs/Semver'
          default: 2.0.0
        tenant_id:
          $ref: '#/$defs/Id'
        version_id:
          $ref: '#/$defs/Id'
      required:
      - tenant_id
      - object_type
      - object_id
      - version_id
      type: object
    Semver:
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$
      type: string
  $id: urn:financial-crime:skill:document.validity.assess:output:0.3.0
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    assessments:
      items:
        $ref: '#/$defs/DocumentValidityAssessment'
      maxItems: 10000
      type: array
  required:
  - assessments
  type: object
