limitations:
- This package is an implemented synthetic reference, not a qualified production service.
  Its scope is the behavior stated above and the typed input/output contracts. Independent
  representative evaluation, approved institution policy and supported source mappings
  remain required. Compares top-level scalar fields after case and whitespace normalization
  only. Nested rows (parties, ownership edges, accounts) are not compared; review
  them as units.
maturity: implemented_synthetic
optional_context: []
output_schema:
  $defs:
    ConflictingValue:
      additionalProperties: false
      properties:
        document_version:
          $ref: '#/$defs/Id'
        normalized:
          $ref: '#/$defs/Text'
        ref:
          $ref: '#/$defs/Ref'
        value:
          $ref: '#/$defs/JsonValue'
      required:
      - document_version
      - value
      - normalized
      - ref
      type: object
    Count:
      minimum: 0
      type: integer
    FieldConflict:
      additionalProperties: false
      properties:
        field:
          $ref: '#/$defs/Id'
        subject:
          $ref: '#/$defs/Id'
        values:
          items:
            $ref: '#/$defs/ConflictingValue'
          maxItems: 10000
          type: array
      required:
      - subject
      - field
      - values
      type: object
    Id:
      maxLength: 512
      minLength: 1
      type: string
    JsonValue:
      anyOf:
      - type: 'null'
      - type: boolean
      - maxLength: 200000
        type: string
      - type: number
      - items:
          $ref: '#/$defs/JsonValue'
        maxItems: 10000
        type: array
      - additionalProperties:
          $ref: '#/$defs/JsonValue'
        type: object
        x-dynamic-map-reason: raw JSON source value
    Ref:
      additionalProperties: false
      properties:
        object_id:
          $ref: '#/$defs/Id'
        object_type:
          $ref: '#/$defs/Id'
        schema_version:
          $ref: '#/$defs/Semver'
          default: 2.0.0
        tenant_id:
          $ref: '#/$defs/Id'
        version_id:
          $ref: '#/$defs/Id'
      required:
      - tenant_id
      - object_type
      - object_id
      - version_id
      type: object
    Semver:
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$
      type: string
    Text:
      maxLength: 200000
      type: string
  $id: urn:financial-crime:skill:document.consistency.assess:output:0.3.0
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    compared:
      $ref: '#/$defs/Count'
    conflicts:
      items:
        $ref: '#/$defs/FieldConflict'
      maxItems: 10000
      type: array
  required:
  - conflicts
  - compared
  type: object
