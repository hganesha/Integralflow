          $ref: '#/$defs/JsonValue'
        maxItems: 10000
        type: array
      - additionalProperties:
          $ref: '#/$defs/JsonValue'
        type: object
        x-dynamic-map-reason: raw JSON source value
    Ref:
      additionalProperties: false
      properties:
        object_id:
          $ref: '#/$defs/Id'
        object_type:
          $ref: '#/$defs/Id'
        schema_version:
          $ref: '#/$defs/Semver'
          default: 2.0.0
        tenant_id:
          $ref: '#/$defs/Id'
        version_id:
          $ref: '#/$defs/Id'
