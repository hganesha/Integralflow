      - tenant_id
      - object_type
      - object_id
      - version_id
      type: object
    RegistryAttributes:
      additionalProperties: false
      properties:
        address:
          $ref: '#/$defs/Text'
        extensions:
          $ref: '#/$defs/Extensions'
        jurisdiction:
          $ref: '#/$defs/Id'
        name:
          $ref: '#/$defs/Id'
        registration_id:
          $ref: '#/$defs/Id'
        status:
          $ref: '#/$defs/Id'
      required: []
      type: object
    Semver:
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$
      type: string
    Text:
      maxLength: 200000
      type: string
