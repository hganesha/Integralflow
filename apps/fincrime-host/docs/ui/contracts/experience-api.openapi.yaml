      tags:
      - Auth
      summary: Start OIDC authorization-code + PKCE sign-in
      operationId: getAuthLogin
      x-upstream:
        service: experience-bff
        note: OIDC + PKCE; tokens stay in the BFF session store
      x-screens:
      - shell
      parameters:
      - name: returnTo
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 302 to the IdP
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/Upstream'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/callback:
    get:
      tags:
      - Auth
      summary: OIDC redirect URI
      operationId: getAuthCallback
