          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-ehf_session
      description: Opaque BFF session (Secure, HttpOnly, SameSite=Lax). Tokens never reach the browser.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Session.csrfToken; required with Origin check on every mutation.
  headers:
    CorrelationId:
      schema:
        type: string
      description: Show in error states; links to traces
    ETag:
      schema:
        type: string
      description: Opaque validator; resend as If-None-Match
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
  responses:
    BadRequest:
      description: Invalid input (e.g. command.request_invalid with details.issues)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: No or expired session (session.expired) → re-authenticate, keep unsaved input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: authorization.role_missing | authorization.separation_of_duties | authorization.tenant_mismatch | csrf.invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Missing or not visible to this principal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Revision/lifecycle/assignment/idempotency conflict, or stale basis — refresh and show what changed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unprocessable:
      description: Validation with diagnostics (details.diagnostics / details.report)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: request.rate_limit_exceeded — back off
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Upstream:
      description: bff.upstream_failed — an upstream returned an unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: bff.upstream_unavailable — keep last good data, show stale banner
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    DocumentStudioModel:
      type: object
      additionalProperties: false
      properties:
        profileId:
          type: string
        profileDigest:
          type: string
          pattern: ^(sha256:)?[a-f0-9]{64}$
          description: 'sha256 hex; EHF digests may carry a sha256: prefix'
        provider:
          type: string
        model:
          type: string
      required:
      - profileId
      - profileDigest
      - provider
      - model
      x-owner: control-api
    DocumentStudioRequest:
      type: object
      additionalProperties: false
      properties:
        documentType:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,99}$
        filename:
          type: string
          minLength: 1
          maxLength: 255
        mediaType:
          type: string
        contentBase64:
          type: string
          minLength: 4
          maxLength: 12582912
      required:
      - documentType
      - filename
      - mediaType
      - contentBase64
      x-owner: control-api
    DocumentStudioTestSummary:
      type: object
      additionalProperties: false
      properties:
        testId:
          type: string
        documentVersion:
          type: string
