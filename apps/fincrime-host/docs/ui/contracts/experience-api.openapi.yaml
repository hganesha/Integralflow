      additionalProperties: false
      properties:
        scope:
          $ref: '#/components/schemas/CaseScope'
          description: The case's process scope, as the create-case form sends it; products must be banking products (deposit, card, payments, lending,
            ...)
        customer:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 200
            dateOfBirth:
              type: string
              format: date
              description: A person only
            nationality:
              type: string
              pattern: ^[A-Z]{2}$
              description: A person only
            politicallyExposed:
              type: string
              enum:
              - 'yes'
              - 'no'
              - unknown
              description: 'A person only: declared political exposure (a declaration, never a screening result)'
            pepPosition:
              type: string
              minLength: 1
              maxLength: 200
              description: With politicallyExposed yes
            legalForm:
              type: string
              enum:
              - individual
              - sole_proprietor
              - corporation
              - llc
              - general_partnership
              - limited_partnership
              - ordinary_trust
              - statutory_trust
              - estate
              - foundation
              - association
              - charity
              - fund
              - pension
              - government
              - unknown
              description: An entity or trust only
            registrationNumber:
              type: string
              minLength: 1
              maxLength: 64
            registrationJurisdiction:
              type: string
              pattern: ^[A-Z]{2}$
              description: ISO 3166 alpha-2
            registrationAuthority:
              type: string
              minLength: 1
              maxLength: 120
              description: The issuing registry; the Registration record says not_declared without it
            identifiers:
              type: array
              items:
                $ref: '#/components/schemas/ApplicationIdentifier'
              maxItems: 10
            addresses:
              type: array
              items:
                $ref: '#/components/schemas/ApplicationAddress'
              maxItems: 5
            industry:
              type: string
              pattern: ^[a-z][a-z0-9_]{0,63}$
            businessPurpose:
              type: string
              minLength: 1
              maxLength: 1000
          required:
          - name
          description: 'Individual: dateOfBirth and nationality. Corporate: legalForm, registrationNumber and registrationJurisdiction. Trust: a trust legal
            form (default ordinary_trust).'
        relatedParties:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 200
              kind:
                type: string
                enum:
                - individual
                - company
                - trust
              roles:
                type: array
                items:
                  type: string
                  enum:
                  - joint_holder
                  - beneficial_owner
                  - control_person
                  - director
                  - signatory
                  - attorney
                  - guardian
                  - settlor
                  - trustee
                  - protector
                  - beneficiary
                  - executor
                  - intermediary
                  - underlying_client
                  - guarantor
                maxItems: 6
                description: At least one for an entity's or trust's party; none for a person's relative or associate
              relationToCustomer:
                type: string
                enum:
                - spouse
                - partner
                - parent
                - child
                - sibling
                - other_family
                - close_associate
                description: A person only; required for an individual customer's related parties (recorded as a PEPRelationship)
              ownershipPercent:
                type: string
                pattern: ^(?:100(?:\.0{1,4})?|[1-9]?[0-9](?:\.[0-9]{1,4})?)$
                description: Stated ownership of the customer, percent as a decimal string
              dateOfBirth:
                type: string
                format: date
                description: A person only
              nationality:
                type: string
                pattern: ^[A-Z]{2}$
                description: A person only
              politicallyExposed:
                type: string
                enum:
                - 'yes'
                - 'no'
                - unknown
                description: 'A person only: declared political exposure (a declaration, never a screening result)'
              pepPosition:
                type: string
                minLength: 1
                maxLength: 200
                description: With politicallyExposed yes
              legalForm:
                type: string
                enum:
                - individual
                - sole_proprietor
                - corporation
                - llc
                - general_partnership
                - limited_partnership
                - ordinary_trust
                - statutory_trust
                - estate
                - foundation
                - association
                - charity
                - fund
                - pension
                - government
                - unknown
                description: An entity or trust only
              registrationNumber:
                type: string
                minLength: 1
                maxLength: 64
              registrationJurisdiction:
                type: string
                pattern: ^[A-Z]{2}$
                description: ISO 3166 alpha-2
              registrationAuthority:
                type: string
                minLength: 1
                maxLength: 120
                description: The issuing registry; the Registration record says not_declared without it
              identifiers:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationIdentifier'
                maxItems: 10
              addresses:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationAddress'
                maxItems: 5
            required:
            - name
          maxItems: 50
          description: An entity's or trust's parties (each with a role; a trust needs a trustee; ownership totals at most 100), or an individual's declared
            relatives and close associates
        documents:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              documentType:
                type: string
                pattern: ^[a-z][a-z0-9_]{0,79}$
                description: A document field catalog type id (GET /v1/catalogs?kind=documents), e.g. certificate_of_incorporation
              filename:
                type: string
                minLength: 1
                maxLength: 255
              mediaType:
                type: string
                pattern: ^[a-z0-9.+-]+/[a-z0-9.+-]+$
              contentBase64:
                type: string
                minLength: 4
                maxLength: 5592408
                description: At most 4 MiB decoded
              relatedParty:
                type: integer
                minimum: 0
                maximum: 49
                description: 'Whom the document is about: a related party''s index; absent means the customer'
            required:
            - documentType
            - filename
            - mediaType
            - contentBase64
          maxItems: 5
          description: Registered as case evidence (case-api POST /v1/cases/:caseId/documents) and recorded as unparsed DocumentVersions; needs evidence.write
        expectedActivity:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              product:
                type: string
              currency:
                type: string
                pattern: ^[A-Z]{3}$
              monthlyInflow:
                type: string
                pattern: ^(?:0|[1-9][0-9]{0,14})(?:\.[0-9]{1,2})?$
                description: Exact decimal amount, never a float
              monthlyOutflow:
                type: string
                pattern: ^(?:0|[1-9][0-9]{0,14})(?:\.[0-9]{1,2})?$
                description: Exact decimal amount, never a float
              counterpartyCountries:
                type: array
                items:
                  type: string
                  pattern: ^[A-Z]{2}$
                  description: ISO 3166 alpha-2
                maxItems: 50
            required:
            - product
            - currency
          maxItems: 20
          description: Per requested product
        sourceOfFunds:
          type: string
          minLength: 1
          maxLength: 2000
          description: Declared; recorded unverified
        channel:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: online (default), branch, mobile, relationship_manager, ...
        externalRef:
          type: string
          minLength: 1
          maxLength: 200
        classification:
          type: string
          enum:
          - confidential
          - restricted
          - internal
        bookingJurisdiction:
          type: string
          pattern: ^[A-Z]{2}$
          description: Defaults to the scope's jurisdiction
        synthetic:
          type: boolean
        harnessPlanDigest:
          type: string
          pattern: ^(sha256:)?[a-f0-9]{64}$
          description: The plan the submitter reviewed; a different selection now is 409 case.plan_selection_changed
      required:
      - scope
      - customer
      description: 'A submitted application: the case''s scope and what the applicant declared.'
      x-owner: experience-bff
