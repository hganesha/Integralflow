# Generated by docs/ui/contracts/gen/openapi_v2.py. Contract for the BFF that replaces ehfconcept/apps/control-ui. See docs/ui/ALIGNMENT.md.
openapi: 3.1.0
info:
  title: Experience API v2 (BFF for the EHF control surface + FinCrime domain)
  version: 2.0.0
  license:
    name: Proprietary — internal use
    url: https://example.invalid/proprietary
  description: 'Contract between the web UI and the Experience BFF that replaces `ehfconcept/apps/control-ui`. The mock (MSW) implements this exact contract.


    * EHF shapes `$ref` `upstream/ehf-contracts.schema.json` (exported from `@ehf/contracts`); replaced-BFF view models `$ref` `upstream/control-ui-views.schema.json`;
    FinCrime shapes `$ref` the kyc repo schemas. Nothing upstream is redefined here.

    * `x-upstream` names the service/method/path a relay calls; `x-action` is the EHF platform action enforced upstream; `x-owner` marks BFF-owned projections.

    * The BFF adds no authority: it resolves the session, attaches delegated identity, strips caller-supplied actor/identity headers and forwards. Upstream
    decides.

    * Freshness is polling-first: `x-poll` gives the interval; GETs return `ETag`; send `If-None-Match`.

    * Mutations need the session cookie and `X-CSRF-Token`. A mutation is not done until its durable receipt is returned.

    * `x-status: needs-upstream` operations are specified but wait on an upstream capability (ALIGNMENT §7); `proposed` ones have no upstream owner yet.'
servers:
- url: /api
  description: 'Same origin: Vite dev server proxies /api to MSW or the BFF'
security:
- session: []
tags:
- name: Auth
  description: OIDC + PKCE browser sign-in handled by the BFF (HTML redirects)
- name: Session
  description: Session, roles→actions, environment, search
- name: Platform
  description: Platform overview and health aggregations
- name: Authoring
  description: Harness drafts, agents, skills, imports (control-api relay)
- name: PolicyStudio
  description: Policy templates, compile/evaluate, revision workspaces
- name: Runs
  description: Plans, runs, events, attempts, traces
- name: Cases
  description: Canonical case store (case-api relay)
- name: HumanWork
  description: 'Human work queue: claim, decide, resolve'
- name: Releases
  description: Release manifests and transitions
- name: Integrations
  description: Connectors, bindings, deliveries, human actions
- name: Gateway
  description: Capability gateway registry, adapters, model tiers, receipts
- name: Admin
  description: Providers, model profiles, settings, change log, runtime admission
- name: FinCrime
  description: FinCrime domain module read models (BFF-owned projections over EHF + kyc)
- name: Presentation
  description: A2UI catalog/surfaces/events — proposed, no upstream owner yet
- name: Mock
  description: Mock-only controls (x-mock-only)
paths:
  /auth/login:
