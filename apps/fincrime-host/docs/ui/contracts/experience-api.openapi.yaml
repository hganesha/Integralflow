      operationId: postAuthLogout
      x-upstream:
        service: experience-bff
        note: revoke + clear cookie
      security:
      - session: []
        csrf: []
      responses:
        '200':
          description: '204'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
