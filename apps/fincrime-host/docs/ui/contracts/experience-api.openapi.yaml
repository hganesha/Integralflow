  /v1/platform/health:
    get:
      tags:
      - Admin
      summary: Connection health of the services, stores, runtime and endpoints the platform depends on
      operationId: getPlatformHealth
      x-upstream:
        service: experience-bff
        note: Aggregates each service's live dependency checks; a service that does not answer is reported Unavailable and its dependencies are not listed
      x-action: capability.read
