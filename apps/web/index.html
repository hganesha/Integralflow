<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IntegralFlow</title>
    <script>
      // Apply the saved preference before styles load to avoid a theme flash.
      try {
        const theme = localStorage.getItem("integralflow.theme");
        document.documentElement.dataset.theme = ["light", "dark"].includes(theme) ? theme : "system";
      } catch { document.documentElement.dataset.theme = "system"; }
    </script>
    <link rel="icon" type="image/png" href="/icons/brand-mark.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
