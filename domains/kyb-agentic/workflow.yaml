    - id: identity-ownership-review
      kind: agent
      name: Ownership and control agent (review)
      summary: Establish legal identity, existence, role authority, ownership and control; preserve trust-specific treatment, ownership ranges and incomplete structures.
      role: Ownership specialist
      prompt: Start from the skills' ownership graph and effective interests. Run circular-holding, control or nominee analysis only when it could resolve an open item, and look up a register only for a specific missing link. Never treat a range as an exact interest, and propose a beneficial owner only on an ownership or control basis the records support.
      contextSelectorIds:
        - caseSubjects
        - recOwnershipInterest-identity-ownership-review-ownership-circular-detect
        - recControlRight-identity-ownership-review-ownership-control-resolve
        - recRelationship-identity-ownership-review-ownership-nominee-detect
      inputSchema:
        type: object
      outputSchema:
        type: object
        additionalProperties: false
        required:
          - summary
          - findings
          - gaps
          - requiresHumanReview
          - beneficialOwners
        properties:
          summary:
            type: string
            minLength: 1
          findings:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - type
                - severity
                - reason
                - sourceRefs
              properties:
                type:
                  type: string
                  minLength: 1
                severity:
                  type: string
                  enum:
                    - INFO
                    - REVIEW
                    - BLOCKING
                reason:
                  type: string
                  minLength: 1
                sourceRefs:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
          gaps:
            type: array
            items:
              type: string
          requiresHumanReview:
            type: boolean
          beneficialOwners:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - entityRef
                - basis
                - sourceRefs
              properties:
                entityRef:
                  type: string
                  minLength: 1
                basis:
                  type: string
                  enum:
                    - ownership
                    - control
                interest:
                  type: string
                sourceRefs:
                  type: array
                  minItems: 1
                  items:
                    type: string
