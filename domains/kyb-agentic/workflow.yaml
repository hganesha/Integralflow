            payloadSchema:
              type: object
              required:
                - records
          - commandType: ProposeClaim
            forEach: output.findings
            when: item.severity != "INFO"
            payload:
              predicate: finding:{{ item.type }}
              value:
                severity: "{{ item.severity }}"
                reason: "{{ item.reason }}"
                sourceRefs: "{{ item.sourceRefs }}"
                proposedBy: agent:agent.intake_profile
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
            payloadSchema:
              type: object
              required:
                - predicate
                - value
                - evidenceRefs
          - commandType: ProposeClaim
