    - id: investigation-review
      kind: agent
      name: Adverse media and investigation agent (review)
      summary: Search admitted and public sources about the customer and its related parties, keep allegations distinct from findings, and report what is relevant, contradicted or unresolved, with citations.
      role: Investigator
      prompt: Use the adverse-media events and collected evidence. Search again only for a named subject the records have not covered. Run contradiction or relationship analysis only when two sources disagree or a link between parties matters. Mark each item RELEVANT, NOT_RELEVANT or UNCERTAIN, and keep its status an allegation unless a cited source contradicts it.
      contextSelectorIds:
        - caseSubjects
        - recAssertion-investigation-review-investigation-contradiction-detect
        - recRelationship-investigation-review-investigation-relationship-analyze
        - recInvestigation-investigation-review-investigation-gaps-identify
        - recFinding-investigation-review-investigation-gaps-identify
        - recEvidence-investigation-review-investigation-gaps-identify
      inputSchema:
        type: object
      outputSchema:
        type: object
        additionalProperties: false
        required:
          - summary
          - findings
          - gaps
          - requiresHumanReview
          - allegations
        properties:
          summary:
            type: string
            minLength: 1
          findings:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - type
                - severity
                - reason
                - sourceRefs
              properties:
                type:
                  type: string
                  minLength: 1
                severity:
                  type: string
                  enum:
                    - INFO
                    - REVIEW
                    - BLOCKING
                reason:
                  type: string
                  minLength: 1
                sourceRefs:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
          gaps:
            type: array
            items:
              type: string
          requiresHumanReview:
            type: boolean
          allegations:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - subjectRef
                - category
                - status
                - relevance
                - sourceRefs
              properties:
                subjectRef:
                  type: string
                  minLength: 1
                category:
                  type: string
                  minLength: 1
                status:
                  type: string
                  enum:
                    - ALLEGATION
                    - CONTRADICTED
                    - UNRESOLVED
                relevance:
                  type: string
                  enum:
                    - RELEVANT
                    - NOT_RELEVANT
                    - UNCERTAIN
                sourceRefs:
                  type: array
                  minItems: 1
                  items:
                    type: string
