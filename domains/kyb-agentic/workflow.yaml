    - id: decision-support-review
      kind: agent
      name: Decision support agent (review)
      summary: Reconcile applicable obligations and evidence into a product-specific recommendation, restrictions, approval authority and monitoring handoff for authorized human review.
      role: Compliance officer (advisory)
      prompt: "Use the compiled requirements, rule evaluations and recommendation. Evaluate gaps when a requirement is unmet. Cite the records behind every point; recommend COLLECT_EVIDENCE when something required is missing, and ESCALATE when policy, sanctions or ownership findings need a senior decision. Read the earlier agents' findings and the screening hits: they are unverified proposals, but a blocking sanctions or ownership finding is never a matter of collecting evidence alone."
      contextSelectorIds:
        - caseSubjects
        - recControl-decision-support-review-decision-gaps-evaluate
        - readFinding-decision-support-review
        - readScreeningHit-decision-support-review
      inputSchema:
        type: object
      outputSchema:
        type: object
        additionalProperties: false
        required:
          - summary
          - findings
          - gaps
          - requiresHumanReview
          - recommendation
          - rationale
          - citedRecords
          - final
        properties:
          summary:
            type: string
            minLength: 1
          findings:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - type
                - severity
                - reason
                - sourceRefs
              properties:
                type:
                  type: string
                  minLength: 1
                severity:
                  type: string
                  enum:
                    - INFO
                    - REVIEW
                    - BLOCKING
                reason:
                  type: string
                  minLength: 1
                sourceRefs:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
          gaps:
            type: array
            items:
              type: string
          requiresHumanReview:
            const: true
          recommendation:
            type: string
            enum:
              - REVIEW_FOR_ACCEPTANCE
              - COLLECT_EVIDENCE
              - ESCALATE
              - RECOMMEND_DECLINE
          rationale:
            type: string
            minLength: 1
          citedRecords:
            type: array
            minItems: 1
            items:
              type: string
          final:
            const: false
