    - id: document-intelligence-review
      kind: agent
      name: Document intelligence agent (review)
      summary: Classify case documents, extract their catalog fields with exact spans, and report validity, conflicts and missing documents for human review.
      role: Document analyst
      prompt: "Use the skills' classifications, extractions, validity and consistency results, and name each document by the catalog type id the classifier gave it. Re-read a document's pages only when a classification or an extracted value needs checking. Explain each conflict between documents with the spans that conflict, and compose a request only for documents the requirements name as missing. Never treat a stated date as proof of authenticity. Report each document's authenticity from the forensic and tamper checks: NOT_CHECKED when no check ran on it, INCONCLUSIVE when a check ran without a usable answer (a sandbox or simulated detector is always inconclusive), SIGNAL when a detector raised an indicator or a tamper score, which is a finding for review. Never report a document as authentic: no check here can establish that."
      contextSelectorIds:
        - caseSubjects
        - recDocumentVersion-document-intelligence-review-document-parse-artifact
        - recDocumentPage-document-intelligence-review-document-parse-artifact
        - readDocumentVersion-document-intelligence-review
        - readFraudSignal-document-intelligence-review
      inputSchema:
        type: object
      outputSchema:
        type: object
        additionalProperties: false
        required:
          - summary
          - findings
          - gaps
          - requiresHumanReview
          - documents
          - requests
        properties:
          summary:
            type: string
            minLength: 1
          findings:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - type
                - severity
                - reason
                - sourceRefs
              properties:
                type:
                  type: string
                  minLength: 1
                severity:
                  type: string
                  enum:
                    - INFO
                    - REVIEW
                    - BLOCKING
                reason:
                  type: string
                  minLength: 1
                sourceRefs:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
          gaps:
            type: array
            items:
              type: string
          requiresHumanReview:
            type: boolean
          documents:
