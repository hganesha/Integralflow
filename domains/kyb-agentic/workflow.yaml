    - id: acquire-registry
      kind: tool
      name: Company registry lookup
      summary: Acquire through wiring:companies-house:business.registry.lookup; write the normalized RegistryRecord, Entity, Party records, or an evidence gap when the check established nothing.
      contextSelectorIds:
        - name
        - country
        - registrationNumber
        - lei
      capabilities:
        tools:
          - business.registry.lookup.v1
      config:
        evidenceCapture:
          type: kyb_acquire_registry
          sourceType: TOOL
          trustTier: VERIFIED_PROVIDER
          instructionTrust: UNTRUSTED_EXTERNAL
        caseWriteActor: system
        caseWritePrincipalId: kyb-connector-normalizer
        caseWrites:
          - commandType: LinkEvidence
            payload:
              evidenceId: "{{ evidence.evidenceId }}"
              purpose: KYB_REGISTRY_LOOKUP
            payloadSchema:
              type: object
              required:
                - evidenceId
                - purpose
          - commandType: RecordCanonicalRecords
            when: output.records.0
            payload:
              records: "{{ output.records }}"
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
            payloadSchema:
              type: object
              required:
                - records
                - evidenceRefs
          - commandType: RecordScreeningFinding
            when: output.recordGap
            payload:
              findingId: finding_evidence_gap_acquire_registry_{{ run.runId }}
              findingType: EVIDENCE_GAP
              classification: REVIEW
              confidence:
                value: 1
                method: connector_outcome
              reason: "{{ output.recordGap.reason }}"
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
              factRefs: []
              policyRelevance: KYB-EVIDENCE
            payloadSchema:
              type: object
              required:
                - findingId
                - findingType
                - reason
                - evidenceRefs
