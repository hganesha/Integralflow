    - id: qa-assurance-review
      kind: agent
      name: QA and assurance agent (review)
      summary: Independently challenge legal applicability, omitted parties, evidence sufficiency, stale sources, unsupported findings, overrides and monitoring handoff.
      role: QA reviewer
      prompt: Use the findings verification and policy compliance results. Check for unsupported claims or coverage gaps only where an agent's output or a finding warrants it. Raise each challenge with the records it rests on; an absent record is a challenge, never a pass.
      contextSelectorIds:
        - caseSubjects
        - recFinding-qa-assurance-review-quality-hallucination-detect
        - recEvidence-qa-assurance-review-quality-hallucination-detect
        - readFinding-qa-assurance-review
      inputSchema:
        type: object
      outputSchema:
        type: object
        additionalProperties: false
        required:
          - summary
          - findings
          - gaps
          - requiresHumanReview
          - challenges
          - passed
        properties:
          summary:
            type: string
            minLength: 1
          findings:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - type
                - severity
                - reason
                - sourceRefs
              properties:
                type:
                  type: string
                  minLength: 1
                severity:
                  type: string
                  enum:
                    - INFO
                    - REVIEW
                    - BLOCKING
                reason:
                  type: string
                  minLength: 1
                sourceRefs:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
          gaps:
            type: array
            items:
              type: string
          requiresHumanReview:
            type: boolean
          challenges:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - area
                - reason
                - sourceRefs
              properties:
                area:
                  type: string
                  enum:
                    - LEGAL_APPLICABILITY
                    - OMITTED_PARTY
                    - EVIDENCE_SUFFICIENCY
                    - STALE_SOURCE
                    - UNSUPPORTED_CLAIM
                    - POLICY_COMPLIANCE
                reason:
                  type: string
                  minLength: 1
                sourceRefs:
                  type: array
                  items:
                    type: string
          passed:
            type: boolean
      config:
        agentRef: agent.qa_assurance
        loop:
          maxSteps: 6
          maxObservationChars: 24000
          tools: []
          skills:
            - skillId: quality.hallucination.detect
