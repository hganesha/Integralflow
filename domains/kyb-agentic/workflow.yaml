                    agent_id: agent.qa_assurance
                    execution_mode: agent_review
                  classification: CONFIDENTIAL
                  purposes:
                    - onboarding
                    - investigation
                    - review
                  synthetic: "{{ syntheticCase }}"
            payloadSchema:
              type: object
              required:
                - records
          - commandType: ProposeClaim
            forEach: output.findings
            when: item.severity != "INFO"
            payload:
              predicate: finding:{{ item.type }}
              value:
                severity: "{{ item.severity }}"
                reason: "{{ item.reason }}"
                sourceRefs: "{{ item.sourceRefs }}"
                proposedBy: agent:agent.qa_assurance
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
            payloadSchema:
              type: object
              required:
                - predicate
                - value
                - evidenceRefs
