                text: "Institution appetite: two independent people approve every onboarding decision a person makes; only the low-risk carve-out (automatic_approval_low_risk) decides without one."
                sources: []
              automatic_approval_enabled:
                layer: pack.baseline
                text: No pack approves a customer without a person.
                sources: []
              automatic_approval_low_risk:
                layer: pack.institution.bank-synthetic
                text: "SYNTHETIC placeholder, not a real institution's appetite: the disposition checkpoint may approve a low-risk case without a person. Every other decision needs dual control."
                sources: []
              low_risk_max_factor_score:
                layer: pack.institution.bank-synthetic
                text: "SYNTHETIC placeholder: a case is low risk only when every risk factor scores at or below 0.20 (the corpus's clean individual, H01, scores at most 0.05)."
                sources: []
              automatic_decline_enabled:
                layer: pack.baseline
                text: No pack declines a customer without a person.
                sources: []
              diligence_floors:
                layer: pack.baseline
                text: "No floor: a cell's level comes from the institution's diligence matrix. Layers may only raise floors (keys are customer type or *, then product or *)."
                sources: []
              mandatory_overlays:
                layer: pack.jurisdiction.uk
                text: MLR 2017 reg 35 requires enhanced due diligence for a PEP, a PEP's family member or known close associate; reg 33(1)(b) requires it for a relationship with a person established in a high-risk third country.
                sources:
                  - https://www.legislation.gov.uk/uksi/2017/692/regulation/35
                  - https://www.legislation.gov.uk/uksi/2017/692/regulation/33
              simplified_due_diligence_permitted:
                layer: pack.institution.bank-synthetic
                text: "Institution decision pending: simplified due diligence is not adopted until the policy owner approves where it applies, so an SDD cell is applied as CDD."
                sources: []
            gateBundles: {}
            knownDifferences:
              - layer: pack.jurisdiction.uk
                field: ownership_threshold
                text: "UK law says more than 25 percent; the library's UBO skill counts 25 percent or more. An owner of exactly 25 percent is therefore treated as a beneficial owner: stricter than the regulation, never looser."
              - layer: pack.jurisdiction.uk
                field: sanctions_ownership
                text: "OFSI does not aggregate the holdings of different designated persons; the library's ofac_50_percent rule does. Aggregation flags more entities than the UK test: stricter, never looser. A UK-specific rule needs a library change."
            digest: afa96a4431bad715820191942844d164c69340e6c3c0c8828a8979782e253fb6
