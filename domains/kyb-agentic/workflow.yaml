                  classification: CONFIDENTIAL
                  purposes:
                    - onboarding
                    - investigation
                    - review
                  synthetic: "{{ syntheticCase }}"
            payloadSchema:
              type: object
              required:
                - records
          - commandType: ProposeClaim
            forEach: output.findings
            when: item.severity != "INFO"
            payload:
              predicate: finding:{{ item.type }}
              value:
                severity: "{{ item.severity }}"
                reason: "{{ item.reason }}"
                sourceRefs: "{{ item.sourceRefs }}"
                proposedBy: agent:agent.relationship_product
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
            payloadSchema:
              type: object
              required:
                - predicate
                - value
                - evidenceRefs
          - commandType: ProposeClaim
            when: output.__taskCompletion.status
            payload:
              predicate: agent_task_outcome
              value:
                agent: agent.relationship_product
                status: "{{ output.__taskCompletion.status }}"
                reasons: "{{ output.__taskCompletion.reasons }}"
                proposedBy: runtime:task-completion
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
            payloadSchema:
              type: object
              required:
                - predicate
                - value
                - evidenceRefs
