        caseWritePrincipalId: agent.identity_verification
        caseWrites:
          - commandType: LinkEvidence
            payload:
              evidenceId: "{{ evidence.evidenceId }}"
              purpose: KYB_AGENTIC_IDENTITY_VERIFICATION_REVIEW
            payloadSchema:
              type: object
              required:
                - evidenceId
                - purpose
          - commandType: RecordCanonicalRecords
            forEach: output.findings
            when: item.severity != "INFO"
            payload:
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
              records:
                - object_type: Finding
                  object_id: finding:{{ run.runId }}:{{ run.nodeId }}:{{ itemIndex }}
                  version_id: v1
                  data:
                    claim: "{{ item.type }}: {{ item.reason }}"
                    evidence_ids:
                      - "{{ evidence.evidenceId }}"
                    status: UNVERIFIED
                  subject_ids: "{{ subjects }}"
                  observed_at: "{{ run.at }}"
                  source_refs: []
                  provenance:
                    method: agent_proposal
                    agent_id: agent.identity_verification
                    execution_mode: agent_review
                  classification: CONFIDENTIAL
                  purposes:
                    - onboarding
                    - investigation
                    - review
                  synthetic: "{{ syntheticCase }}"
            payloadSchema:
              type: object
              required:
                - records
          - commandType: ProposeClaim
            forEach: output.findings
            when: item.severity != "INFO"
            payload:
              predicate: finding:{{ item.type }}
              value:
                severity: "{{ item.severity }}"
                reason: "{{ item.reason }}"
                sourceRefs: "{{ item.sourceRefs }}"
                proposedBy: agent:agent.identity_verification
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
            payloadSchema:
              type: object
              required:
                - predicate
                - value
                - evidenceRefs
          - commandType: RaiseContradiction
            forEach: output.documentChecks
            when: item.outcome == "CONFLICT"
            payload:
              objectRefs: "{{ item.sourceRefs }}"
              materiality: REVIEW
              detectionMethod: agent:agent.identity_verification
              description: "{{ item.entityRef }} {{ item.field }}: the document states {{ item.documentValue }}; the record holds {{ item.recordValue }}."
            payloadSchema:
              type: object
              required:
                - objectRefs
                - description
                - materiality
                - detectionMethod
          - commandType: ProposeClaim
            when: output.__taskCompletion.status
            payload:
              predicate: agent_task_outcome
              value:
                agent: agent.identity_verification
                status: "{{ output.__taskCompletion.status }}"
                reasons: "{{ output.__taskCompletion.reasons }}"
                proposedBy: runtime:task-completion
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
            payloadSchema:
              type: object
              required:
                - predicate
                - value
                - evidenceRefs
