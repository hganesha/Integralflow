    - id: relationship-product-review
      kind: agent
      name: Relationship and product agent (review)
      summary: Establish the purpose of each requested product, whether expected activity is consistent with the customer's profile and geography, and the monitoring the relationship needs once open.
      role: Relationship analyst
      prompt: Use the product profile and expected-behavior baseline. Profile geography or classify the industry only when the products' expected activity depends on it. Mark each product's expected activity CONSISTENT, INCONSISTENT or UNKNOWN with the records it rests on.
      contextSelectorIds:
        - caseSubjects
        - recGeographyExposure-relationship-product-review-party-geography-profile
        - recParty-relationship-product-review-party-industry-classify
      inputSchema:
        type: object
      outputSchema:
        type: object
        additionalProperties: false
        required:
          - summary
          - findings
          - gaps
          - requiresHumanReview
          - products
          - monitoringNotes
        properties:
          summary:
            type: string
            minLength: 1
          findings:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - type
                - severity
                - reason
                - sourceRefs
              properties:
                type:
                  type: string
                  minLength: 1
                severity:
                  type: string
                  enum:
                    - INFO
                    - REVIEW
                    - BLOCKING
                reason:
                  type: string
                  minLength: 1
                sourceRefs:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
          gaps:
            type: array
            items:
              type: string
          requiresHumanReview:
            type: boolean
          products:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - product
                - expectedActivity
                - rationale
              properties:
                product:
                  type: string
                  minLength: 1
