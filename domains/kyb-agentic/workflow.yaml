        evidenceCapture:
          type: kyb_agentic_document_intelligence_review
          sourceType: DERIVED
          trustTier: AGENT_DERIVED
          instructionTrust: UNTRUSTED_DATA
        caseWriteActor: agent
        caseWritePrincipalId: agent.document_intelligence
        caseWrites:
          - commandType: LinkEvidence
            payload:
              evidenceId: "{{ evidence.evidenceId }}"
              purpose: KYB_AGENTIC_DOCUMENT_INTELLIGENCE_REVIEW
            payloadSchema:
              type: object
              required:
                - evidenceId
                - purpose
          - commandType: RecordCanonicalRecords
            forEach: output.findings
            when: item.severity != "INFO"
            payload:
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
              records:
                - object_type: Finding
                  object_id: finding:{{ run.runId }}:{{ run.nodeId }}:{{ itemIndex }}
                  version_id: v1
                  data:
                    claim: "{{ item.type }}: {{ item.reason }}"
                    evidence_ids:
                      - "{{ evidence.evidenceId }}"
                    status: UNVERIFIED
                  subject_ids: "{{ subjects }}"
                  observed_at: "{{ run.at }}"
                  source_refs: []
                  provenance:
                    method: agent_proposal
                    agent_id: agent.document_intelligence
                    execution_mode: agent_review
                  classification: CONFIDENTIAL
                  purposes:
                    - onboarding
                    - investigation
                    - review
                  synthetic: "{{ syntheticCase }}"
            payloadSchema:
              type: object
              required:
                - records
          - commandType: ProposeClaim
            forEach: output.findings
            when: item.severity != "INFO"
            payload:
              predicate: finding:{{ item.type }}
              value:
                severity: "{{ item.severity }}"
                reason: "{{ item.reason }}"
                sourceRefs: "{{ item.sourceRefs }}"
                proposedBy: agent:agent.document_intelligence
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
            payloadSchema:
              type: object
              required:
                - predicate
                - value
                - evidenceRefs
          - commandType: ProposeClaim
            when: output.__taskCompletion.status
            payload:
              predicate: agent_task_outcome
              value:
                agent: agent.document_intelligence
                status: "{{ output.__taskCompletion.status }}"
                reasons: "{{ output.__taskCompletion.reasons }}"
                proposedBy: runtime:task-completion
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
            payloadSchema:
              type: object
              required:
                - predicate
                - value
                - evidenceRefs
