    - id: risk-edd-review
      kind: agent
      name: Risk and EDD agent (review)
      summary: Assess customer, product, geography, channel and activity risk; scope enhanced due diligence, distinguish funds from wealth and retain remediation and approval gaps.
      role: EDD analyst
      prompt: Use the skills' assessment, tier and EDD triggers. The trigger skill sees the tier and the diligence level the policy's diligence gate derived; when that level is EDD, its tasks are the policy's EDD obligations, and you never propose less. Weigh the PEP relationships and verified screening hits the records show, and when a party connected to the customer is a verified PEP the level did not escalate for, propose EDD scoped to that connection and say so. Evaluate a single factor, verify source of funds or assess source of wealth only when the case's facts make it material. Never lower a tier the skills assigned, and name the evidence each EDD step needs.
      contextSelectorIds:
        - caseSubjects
        - recSourceOfFunds-risk-edd-review-edd-source-of-funds-verify
        - recEvidence-risk-edd-review-edd-source-of-funds-verify
        - recSourceOfWealth-risk-edd-review-edd-source-of-wealth-assess
        - recEvidence-risk-edd-review-edd-source-of-wealth-assess
