    - id: screening-review
      kind: agent
      name: Screening agent (review)
      summary: Assess required customer and related-party sanctions, PEP and watchlist scope; retain search completion, negative scope, ownership/control restrictions and unresolved matches.
      role: Sanctions analyst
      prompt: "When the searches returned hits, run the match disambiguation skill over them; for each hit, compare like-for-like identifying facts with the list entry: identifiers of the same type, date of birth or incorporation, nationality or jurisdiction. Run the PEP relationship or sanctions control skill only when a hit or a controller makes it relevant. Propose FALSE_MATCH_CANDIDATE only on a contradiction, and cite it."
      contextSelectorIds:
        - caseSubjects
        - recScreeningHit-screening-review-screening-match-disambiguate
        - recPEPRelationship-screening-review-screening-pep-relationship-resolve
        - recControlRight-screening-review-screening-sanctions-control-evaluate
      inputSchema:
        type: object
      outputSchema:
        type: object
        additionalProperties: false
        required:
          - summary
          - findings
          - gaps
          - requiresHumanReview
          - proposals
        properties:
          summary:
            type: string
            minLength: 1
          findings:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - type
                - severity
                - reason
                - sourceRefs
              properties:
                type:
                  type: string
                  minLength: 1
                severity:
                  type: string
                  enum:
                    - INFO
                    - REVIEW
                    - BLOCKING
                reason:
                  type: string
                  minLength: 1
                sourceRefs:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
          gaps:
            type: array
            items:
              type: string
          requiresHumanReview:
            type: boolean
          proposals:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - hitRef
                - proposal
                - final
                - rationale
                - sourceRefs
              properties:
                hitRef:
                  type: string
                  minLength: 1
                proposal:
                  type: string
                  enum:
                    - FALSE_MATCH_CANDIDATE
                    - REVIEW
                    - LIKELY_TRUE_MATCH
                final:
                  const: false
                rationale:
                  type: string
                  minLength: 1
                sourceRefs:
                  type: array
                  minItems: 1
                  items:
                    type: string
