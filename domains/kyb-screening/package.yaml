        description: "Bounded loop over read-only registry, officer, LEI and ownership connectors: explain what remains unresolved in the ownership structure (ranges, cycles, unaccounted interest, unverified owners) and what would resolve it. Proposes; decides nothing."
        text: Start from the ownership records the skills used. Run an ownership skill (circular holdings, control rights, nominee indicators) only when its result could resolve an open item. For every unresolved item (an ownership range, a cycle, interest not accounted for, an owner without verification) look up only what could resolve it, and record each finding with the record or observation ids it rests on. Never compute a final UBO list, never treat a range as an exact interest, never treat a connector outcome of unknown, not_checked or inconclusive as resolved, and say plainly what remains open.
