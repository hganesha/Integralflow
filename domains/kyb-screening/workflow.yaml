    - id: screening-review
      kind: agent
      name: Screening candidate review (advisory agent)
      summary: "Bounded loop over read-only registry and identifier connectors: for each screening candidate, gather corroborating or contradicting identifying facts and propose a non-final disposition for the reviewer. Never clears a hit."
      role: Sanctions analyst (advisory)
      prompt: "For each screening hit, compare the subject's identifying facts with the list entry's. Run the PEP relationship or sanctions control skill only when a hit or a controller makes it relevant: identifiers of the same type, date of birth or incorporation, nationality or jurisdiction. Look up a registry or identifier record only when it could confirm or contradict the match. Propose FALSE_MATCH_CANDIDATE only when a like-for-like identifying fact contradicts the entry, LIKELY_TRUE_MATCH only when one corroborates it, and REVIEW otherwise. Every proposal is final: false and cites the records or observations it rests on; a person makes every disposition."
      contextSelectorIds:
        - kybSubjects
        - reviewEntities
        - reviewScreeningHits
        - reviewWatchlistEntries
        - recPEPRelationship-screening-review-screening-pep-relationship-resolve
        - recControlRight-screening-review-screening-sanctions-control-evaluate
      inputSchema:
        type: object
      outputSchema:
        type: object
        additionalProperties: false
        required:
          - summary
          - proposals
          - gaps
          - requiresHumanReview
        properties:
          summary:
            type: string
            minLength: 1
          proposals:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - hitRef
                - proposal
                - final
                - rationale
                - sourceRefs
              properties:
                hitRef:
                  type: string
                  minLength: 1
                proposal:
                  type: string
                  enum:
                    - FALSE_MATCH_CANDIDATE
                    - REVIEW
                    - LIKELY_TRUE_MATCH
                final:
                  const: false
                rationale:
                  type: string
                  minLength: 1
                sourceRefs:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
          gaps:
            type: array
            items:
              type: string
          requiresHumanReview:
            const: true
      config:
        agentRef: agent.screening
        loop:
          maxSteps: 6
          maxObservationChars: 24000
          tools:
            - business.registry.lookup.v1
            - reference.identifier.lookup.v1
          skills:
            - skillId: screening.pep.relationship.resolve
              contextSelectorIds:
                - recPEPRelationship-screening-review-screening-pep-relationship-resolve
              parameters: {}
              skillPolicy:
                policyRef: policy.kyb.screening-ownership.us
                policyVersion: 1.0.0
                bundleDigest: 399486a9cb8b5f74a7993655ad3ec2ff0f7005ebfa5c5cdcecd42f10eb0d9b58
                fields:
                  - freshness_seconds
                  - jurisdiction
                  - permissions
                  - version
                values:
                  freshness_seconds:
                    WatchlistEntry: 86400
                    VerificationRecord: 7776000
                  jurisdiction: US
                  permissions:
                    - skill:screening.pep.relationship.resolve
                  version: 1.0.0
                sources:
                  freshness_seconds: policy/slice-policy.json freshness_seconds (KYC owner inputs D01 (list freshness 1 day) and D05 (identity verification 90 days))
                  jurisdiction: policy/slice-policy.json jurisdiction (slice scope (docs/implementation/production-slice-1.md section 2))
                  permissions: policy/slice-policy.json permissions
                  version: policy/slice-policy.json version
                unresolved: []
              purpose: onboarding
            - skillId: screening.sanctions.control.evaluate
              contextSelectorIds:
                - recControlRight-screening-review-screening-sanctions-control-evaluate
              parameters: {}
              skillPolicy:
                policyRef: policy.kyb.screening-ownership.us
                policyVersion: 1.0.0
                bundleDigest: 399486a9cb8b5f74a7993655ad3ec2ff0f7005ebfa5c5cdcecd42f10eb0d9b58
                fields:
                  - freshness_seconds
                  - jurisdiction
                  - permissions
                  - sanctions_control_bases
                  - version
                values:
                  freshness_seconds:
                    WatchlistEntry: 86400
                    VerificationRecord: 7776000
                  jurisdiction: US
                  permissions:
                    - skill:screening.sanctions.control.evaluate
                  sanctions_control_bases:
                    - voting_majority
                  version: 1.0.0
                sources:
                  freshness_seconds: policy/slice-policy.json freshness_seconds (KYC owner inputs D01 (list freshness 1 day) and D05 (identity verification 90 days))
                  jurisdiction: policy/slice-policy.json jurisdiction (slice scope (docs/implementation/production-slice-1.md section 2))
                  permissions: policy/slice-policy.json permissions
                  sanctions_control_bases: "policy/slice-policy.json sanctions_control_bases (candidate: OFAC control guidance; only majority voting control counts as sanctions control)"
                  version: policy/slice-policy.json version
                unresolved: []
              purpose: onboarding
          repairAttempts: 1
        completion:
          criteria:
            - nodeId: screening-sanctions-execute
              acceptedStatuses:
                - COMPLETED
