    - id: ownership-review
      kind: agent
      name: Ownership review (advisory agent)
      summary: "Bounded loop over read-only registry, officer, LEI and ownership connectors: explain what remains unresolved in the ownership structure (ranges, cycles, unaccounted interest, unverified owners) and what would resolve it. Proposes; decides nothing."
      role: Ownership analyst (advisory)
      prompt: Start from the ownership records the skills used. Run an ownership skill (circular holdings, control rights, nominee indicators) only when its result could resolve an open item. For every unresolved item (an ownership range, a cycle, interest not accounted for, an owner without verification) look up only what could resolve it, and record each finding with the record or observation ids it rests on. Never compute a final UBO list, never treat a range as an exact interest, never treat a connector outcome of unknown, not_checked or inconclusive as resolved, and say plainly what remains open.
      contextSelectorIds:
        - kybSubjects
        - reviewEntities
        - reviewOwnershipInterests
        - reviewOwnershipRanges
        - reviewControlRights
        - reviewBeneficialOwners
        - recOwnershipInterest-ownership-review-ownership-circular-detect
        - recControlRight-ownership-review-ownership-control-resolve
        - recRelationship-ownership-review-ownership-nominee-detect
      inputSchema:
        type: object
      outputSchema:
        type: object
        additionalProperties: false
        required:
          - summary
          - findings
          - gaps
          - requiresHumanReview
        properties:
          summary:
            type: string
            minLength: 1
          findings:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - type
                - entityRef
                - reason
                - sourceRefs
              properties:
                type:
                  type: string
                  enum:
                    - UNRESOLVED_RANGE
                    - CYCLE
                    - UNACCOUNTED_INTEREST
                    - UNVERIFIED_OWNER
                    - CONTROL_WITHOUT_OWNERSHIP
                    - OTHER
                entityRef:
                  type: string
                  minLength: 1
                reason:
                  type: string
                  minLength: 1
                sourceRefs:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
          gaps:
            type: array
            items:
              type: string
          requiresHumanReview:
            const: true
      config:
        agentRef: agent.identity_ownership
        loop:
