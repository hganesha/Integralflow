              MX-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              NL-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              OS-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              SE-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              US-NY-SPECIMEN:
                pattern: SPECIMEN-H[0-9]{2}-DL-[0-9]{4}
              US-NJ-SPECIMEN:
                pattern: SPECIMEN-H[0-9]{2}-DL-[0-9]{4}
              US-DE-SPECIMEN:
                pattern: SPECIMEN-H[0-9]{2}-DL-[0-9]{4}
              synthetic-registry:
                pattern: SYN-[A-Z]{2}-[A-Z0-9]{5,10}
              synthetic-free-zone-registry:
                pattern: SYN-[A-Z]{2}-FZ-[0-9]{6}
              synthetic-luhn:
                pattern: "[0-9]{8,19}"
                checksum: luhn
          industries:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: classifies every industry code in the corpus; individuals carry none, so the same map is harmless here."
            schemaVersion: 2.0.0
            value:
              metal_fabrication: manufacturing
              general_trading: wholesale_trade
              holding_company: holding_and_investment
              courier_services: transport_and_logistics
          permitted_providers:
            status: UNRESOLVED
            owner: installation.policy.owner
            reason: Supply reviewed installation policy content.
          profile_fields:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: legal name is the only profile field every individual corpus party carries."
            schemaVersion: 2.0.0
            value:
              - legal_name
          recommendations:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: maps control outcomes to review recommendations; no outcome recommends automatic acceptance."
            schemaVersion: 2.0.0
            value:
              PASS: REVIEW_FOR_ACCEPTANCE
              FAIL: ESCALATE
              UNKNOWN: COLLECT_EVIDENCE
          required_document_types:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: every handler treats this list as all-of, so identity and address alternatives live as any-of groups in the ehf.document extension (the kyc-v2 convention)."
            schemaVersion: 2.0.0
            value: []
          requirements:
            status: DERIVED
            owner: installation.policy.owner
            from: diligence
            base:
              owner: synthetic.policy.placeholder
              basis: "SYNTHETIC: as US without the taxpayer-identification obligation, which is a US CIP element."
              value:
                - id: EVD-CIP-IDENTITY-DOCUMENT
                  description: "Synthetic: a government identity document"
                  control:
                    pass:
                      all:
                        - field: documents_required
                          op: contains
                          value: EVD-CIP-IDENTITY-DOCUMENT
                        - field: documents_missing
                          op: excludes
                          value: EVD-CIP-IDENTITY-DOCUMENT
                - id: EVD-CIP-ADDRESS
                  description: "Synthetic: evidence of residential address"
                  control:
                    pass:
                      all:
                        - field: documents_required
                          op: contains
                          value: EVD-CIP-ADDRESS
                        - field: documents_missing
                          op: excludes
                          value: EVD-CIP-ADDRESS
                - id: EVD-IDENTITY-VERIFICATION
                  description: "Synthetic: verified identity"
                  control:
                    pass:
                      all:
                        - field: identity_verified
                          op: contains
                          value: true
                        - field: identity_verified
                          op: excludes
                          value: false
                    fail:
                      field: identity_verified
                      op: contains
                      value: false
                - id: EVD-SANCTIONS-SCREENING
                  description: "Synthetic: sanctions screening disposed"
                  control:
                    pass:
                      field: sanctions_hits
                      op: eq
                      value: []
                - id: EVD-PEP-SCREENING
                  description: "Synthetic: PEP screening disposed"
                  control:
                    pass:
                      field: pep_hits
                      op: eq
                      value: []
                - id: EVD-ADVERSE-MEDIA
                  description: "Synthetic: adverse media screening disposed"
                  control:
                    pass:
                      field: adverse_media_events
                      op: eq
                      value: []
                - id: EVD-SOURCE-OF-FUNDS
                  description: "Synthetic: corroborated source of funds for high risk"
                  when:
                    field: tier
                    op: eq
                    value: HIGH
                  control:
                    pass:
                      all:
                        - field: funds_verified
                          op: contains
                          value: true
                        - field: funds_verified
                          op: excludes
                          value: false
                - id: EVD-EDD-NARRATIVE
                  description: "Synthetic: EDD narrative for high risk"
                  when:
                    field: tier
                    op: eq
                    value: HIGH
