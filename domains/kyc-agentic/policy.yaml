gates:
  intake-ready:
    inputProfile: canonical.onboarding.v2
    rules:
      - id: synthetic.intake.ready
        when:
          all:
            - path: /facts/selected/packRelationship
              op: count_gte
              value: 1
            - all:
                - every:
                    path: /facts/selected/policyCaseClaims
                    allowEmpty: true
                    where:
                      any:
                        - path: /predicate
                          op: ne
                          value: agent_task_outcome
                        - path: /value/status
                          op: in
                          value:
                            - COMPLETED
                            - NEEDS_REVIEW
                        - some:
                            path: /facts/selected/policyCaseClaims
                            fromInput: true
                            where:
                              all:
                                - path: /predicate
                                  op: eq
                                  value: agent_task_outcome
                                - path: /value/agent
                                  op: eq
                                  valueFromParent:
                                    depth: 1
                                    path: /value/agent
                                - path: /value/status
                                  op: in
                                  value:
                                    - COMPLETED
                                    - NEEDS_REVIEW
                                - path: /created_at
                                  op: after
                                  valueFromParent:
                                    depth: 1
                                    path: /created_at
        result:
          state: DECIDED
          reasonCodes:
            - SYNTHETIC_INTAKE_READY
          ruleIds: []
          actions: []
          humanRequirement: null
          gaps: []
      - id: synthetic.intake.relationship-missing
        when:
          every:
            path: /facts/selected/packRelationship
            allowEmpty: true
            where:
              path: /__no_item_matches__
              op: present
        result:
          state: NEEDS_EVIDENCE
          reasonCodes:
            - BANKING_RELATIONSHIP_MISSING
          ruleIds: []
          actions: []
          humanRequirement: null
          gaps:
            - code: BANKING_RELATIONSHIP_MISSING
              path: /facts/selected/packRelationship
              subjectId: null
      - id: synthetic.intake.agent-task-incomplete
        when:
          some:
            path: /facts/selected/policyCaseClaims
            where:
              all:
                - path: /predicate
                  op: eq
                  value: agent_task_outcome
                - path: /value/status
                  op: ne
                  value: COMPLETED
                - path: /value/status
                  op: ne
                  value: NEEDS_REVIEW
        result:
          state: NEEDS_EVIDENCE
          reasonCodes:
            - AGENT_TASK_INCOMPLETE
          ruleIds: []
          actions: []
          humanRequirement: null
          gaps:
            - code: AGENT_TASK_INCOMPLETE
              path: /facts/selected/policyCaseClaims
              subjectId: null
    otherwise:
      state: NEEDS_EVIDENCE
      reasonCodes:
        - BANKING_RELATIONSHIP_MISSING
      ruleIds: []
      actions: []
      humanRequirement: null
      gaps:
        - code: BANKING_RELATIONSHIP_MISSING
          path: /facts/selected/packRelationship
          subjectId: null
  decision-ready:
    inputProfile: canonical.onboarding.v2
    rules:
      - id: synthetic.decision.edd-escalation
        when:
          some:
            path: /facts/selected/policyCaseClaims
            where:
              path: /predicate
              op: eq
              value: edd_required
        result:
          state: NEEDS_EVIDENCE
          reasonCodes:
            - EDD_ESCALATION_REQUIRED
          ruleIds: []
          actions:
            - kind: case_command
              commandType: ProposeWorkItem
              payload:
                workItemId: edd-escalation
                workType: EDD_ESCALATION
                priority: HIGH
                description: "The EDD triggers fired: continue this case under the enhanced due-diligence process (source of funds and wealth verified, ownership fully mapped)."
          humanRequirement: null
          gaps:
            - code: EDD_ESCALATION_REQUIRED
              path: /facts/selected/policyCaseClaims
              subjectId: null
      - id: synthetic.decision.ready
        when:
          all:
            - all:
                - some:
                    path: /facts/selected/policyCaseClaims
                    where:
                      path: /predicate
                      op: eq
                      value: agent_task_outcome
                - every:
                    path: /facts/selected/policyCaseClaims
                    allowEmpty: false
                    where:
                      any:
                        - path: /predicate
                          op: ne
                          value: agent_task_outcome
                        - path: /value/status
                          op: in
                          value:
                            - COMPLETED
                            - NEEDS_REVIEW
                        - some:
                            path: /facts/selected/policyCaseClaims
                            fromInput: true
                            where:
                              all:
                                - path: /predicate
                                  op: eq
                                  value: agent_task_outcome
                                - path: /value/agent
                                  op: eq
                                  valueFromParent:
                                    depth: 1
                                    path: /value/agent
                                - path: /value/status
                                  op: in
                                  value:
                                    - COMPLETED
                                    - NEEDS_REVIEW
                                - path: /created_at
                                  op: after
                                  valueFromParent:
                                    depth: 1
                                    path: /created_at
            - every:
                path: /configuration/required_screening_types
                allowEmpty: false
                where:
                  some:
                    path: /facts/selected/packScreening
                    fromInput: true
                    where:
                      all:
                        - path: /data/screening_type
                          op: eq
                          valueFromParent:
                            depth: 1
                            path: ""
                        - path: /data/status
                          op: eq
                          value: COMPLETED
                        - path: /data/truncated
                          op: eq
                          value: false
                        - path: /data/query_time
                          op: age_lte_seconds
                          valueFrom: /configuration/freshness_seconds/WatchlistEntry
            - some:
                path: /facts/selected/packVerification
                where:
                  all:
                    - path: /data/status
                      op: eq
                      value: VERIFIED
                    - path: /data/method
                      op: in
                      valueFrom: /configuration/verification_methods
                    - path: /observed_at
                      op: age_lte_seconds
                      valueFrom: /configuration/freshness_seconds/VerificationRecord
        result:
          state: DECIDED
          reasonCodes:
            - SYNTHETIC_DECISION_READY
          ruleIds: []
          actions: []
          humanRequirement: null
          gaps: []
      - id: synthetic.decision.screening-failed
        when:
          some:
            path: /facts/selected/packScreening
            where:
              any:
                - path: /data/status
                  op: ne
                  value: COMPLETED
                - path: /data/truncated
                  op: eq
                  value: true
        result:
          state: NEEDS_EVIDENCE
          reasonCodes:
            - SCREENING_INCOMPLETE
          ruleIds: []
          actions: []
          humanRequirement: null
          gaps:
            - code: SCREENING_INCOMPLETE
              path: /facts/selected/packScreening
              subjectId: null
      - id: synthetic.decision.agent-task-incomplete
        when:
          some:
            path: /facts/selected/policyCaseClaims
            where:
              all:
                - path: /predicate
                  op: eq
                  value: agent_task_outcome
                - path: /value/status
                  op: ne
                  value: COMPLETED
                - path: /value/status
                  op: ne
                  value: NEEDS_REVIEW
        result:
          state: NEEDS_EVIDENCE
          reasonCodes:
            - AGENT_TASK_INCOMPLETE
          ruleIds: []
          actions: []
          humanRequirement: null
          gaps:
            - code: AGENT_TASK_INCOMPLETE
              path: /facts/selected/policyCaseClaims
              subjectId: null
    otherwise:
      state: NEEDS_EVIDENCE
      reasonCodes:
        - DECISION_EVIDENCE_INCOMPLETE
      ruleIds: []
      actions: []
      humanRequirement: null
      gaps:
        - code: DECISION_EVIDENCE_INCOMPLETE
          path: /facts/selected/packScreening
          subjectId: null
