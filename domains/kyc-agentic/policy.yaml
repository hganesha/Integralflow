policySets:
  - id: policy.pack.us.bank-synthetic.personal-banking.v2
    version: 2.0.0
    status: CANDIDATE
    packPin:
      id: policy.pack.us.bank-synthetic.personal-banking
      digest: 695b9ca88d117753d25a65abb8bf1c9a2238ffd4a0418988b31e5b4d18b48e2e
    scope:
      jurisdiction: US
      institution: bank.synthetic
      products:
        - card
        - deposit
        - payments
      customerTypes:
        - individual
      purposes:
        - CDD_ONBOARDING
    modules:
      - id: pack.baseline
        version: 1.0.0
        digest: 60b111d1c4758de9139dea0b7e3abe2fe2dfd51f277717cc6fb025662fa7c43d
      - id: pack.jurisdiction.us
        version: 1.0.0
        digest: 8dc5725a231e03844b9ef06701b30436432b1d63da9dc72229cb64907d7e30fd
      - id: pack.institution.bank-synthetic
        version: 1.0.0
        digest: 0834e06d6f88a4e215b0e40ffc8a959bd3cc548b34ecc4004360ec79af62d6ea
      - id: pack.product.family.pay
        version: 1.0.0
        digest: 511378f2501561e6f546bee2824fef253e8eb6c632004a67f0c70e6898aaff00
      - id: pack.product.payments
        version: 1.1.0
        digest: 261f6f543603b793ee0414035563d6b86a008af1fcab6bcaf36692b4b50923ed
      - id: pack.product.card
        version: 1.0.0
        digest: 8d3230de0a6d86140d95e8d9be8324efc17cb6d11ff9376cf7258a966a796188
      - id: pack.product.deposit
        version: 1.0.0
        digest: deae1379e19623a1f359ffc11bd9e04f4260454b76a1a5cdabd8b61e69302a89
    configuration:
      jurisdiction: US
      screening_threshold: 0.85
      ownership_threshold: "0.25"
      sanctions_ownership:
        rule: ofac_50_percent
        threshold: "0.5"
      control_bases:
        - appoint_board
        - voting_majority
      sanctions_control_bases:
        - voting_majority
      verification_methods:
        - government_id_document
        - registry_extract
      active_registry_statuses:
        - ACTIVE
      freshness_seconds:
        VerificationRecord: 7776000
        WatchlistEntry: 86400
      required_screening_types:
        - pep
        - sanctions
      required_screening_lists:
        - ofac-sdn
      screening_roles:
        - attorney
        - beneficial_owner
        - beneficiary
        - control_person
        - customer
        - director
        - protector
        - settlor
        - signatory
        - trustee
      pep_scope: foreign
      required_party_roles:
        corporate:
          - beneficial_owner
          - customer
        individual:
          - customer
        trust:
          - customer
          - trustee
      dual_control_required: true
      automatic_approval_enabled: false
      automatic_approval_low_risk: true
      low_risk_max_factor_score: "0.20"
      automatic_decline_enabled: false
      diligence_floors: {}
      mandatory_overlays: []
      simplified_due_diligence_permitted: false
      content:
        apiVersion: harness.factory/installation-policy-content-v2
        requiredFields:
          - customer_types
          - edd_triggers
          - extensions
          - freshness_seconds
          - identifier_rules
          - industries
          - permitted_providers
          - profile_fields
          - recommendations
          - required_document_types
          - requirements
          - review_interval_seconds
          - risk_factor_maps
          - risk_model_version
          - risk_tiers
          - risk_weights
          - rules
          - screening_threshold
          - verification_methods
        fields:
          customer_types:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: maps corpus customer_type codes onto the flows' two customer types (individual -> KYC, everything else -> KYB)."
            schemaVersion: 2.0.0
            value:
              individual: individual
              sole_proprietor: corporate
              private_company: corporate
              corporate: corporate
              llc: corporate
              free_zone_company: corporate
              listed_company: corporate
              partnership: corporate
              trust: corporate
          edd_triggers:
            status: DERIVED
            owner: installation.policy.owner
            from: diligence
            base:
              owner: synthetic.policy.placeholder
              basis: "SYNTHETIC: the flows bind the tier and the sanctions, PEP and adverse-media screening outcomes; any HIGH tier or any screening candidate or adverse-media event requires EDD."
              value:
                - id: edd-high-risk-tier
                  predicate:
                    field: tier
                    op: eq
                    value: HIGH
                  tasks:
                    - pep_relationship_review
                    - source_of_funds
                    - source_of_wealth
                    - senior_management_approval
                    - enhanced_ongoing_monitoring
                - id: edd-pep-candidate
                  predicate:
                    field: pep_hits
                    op: ne
                    value: []
                  tasks:
                    - pep_relationship_review
                    - source_of_wealth
                    - senior_management_approval
                - id: edd-sanctions-candidate
                  predicate:
                    field: sanctions_hits
                    op: ne
                    value: []
                  tasks:
                    - sanctions_match_review
                    - senior_management_approval
                - id: edd-adverse-media
                  predicate:
                    field: adverse_media_events
                    op: ne
                    value: []
                  tasks:
                    - adverse_media_review
          extensions:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: any-of document groups in document field catalog vocabulary (passport, driving_licence, utility_bill, ...), as document.requirements.resolve reads them."
            schemaVersion: 2.0.0
            value:
              ehf.document:
                schema_version: 1.0.0
                value:
                  document_requirements:
                    - id: EVD-CIP-IDENTITY-DOCUMENT
                      description: "Synthetic: government identity document"
                      any_of:
                        - passport
                        - national_identity_card
                        - driving_licence
                        - residence_permit
                    - id: EVD-CIP-ADDRESS
                      description: "Synthetic: residential address evidence"
                      any_of:
                        - utility_bill
                        - bank_statement
                        - official_residence_certificate
                        - government_address_letter
                        - telecom_bill
                        - municipal_tax_bill
                    - id: EVD-CIP-TIN
                      description: "Synthetic: taxpayer identification number evidence"
                      any_of:
                        - tax_registration_certificate
                        - individual_tax_self_certification
                        - tax_assessment
                        - personal_tax_return
                        - w9
          freshness_seconds:
            status: RESOLVED
            owner: installation.policy.owner
            basis: Inherited from pinned pack policy.pack.us.bank-synthetic.personal-banking (695b9ca88d117753d25a65abb8bf1c9a2238ffd4a0418988b31e5b4d18b48e2e); candidate until independently approved.
            schemaVersion: 2.0.0
            value:
              VerificationRecord: 7776000
              WatchlistEntry: 86400
          identifier_rules:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: keyed by the issuer the agents pass (the IdentityIdentifier issuer or Registration authority); patterns match corpus specimen values only, never a real document format."
            schemaVersion: 2.0.0
            value:
              US-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              GB-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              BG-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              CY-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              DE-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              ES-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              LU-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              MX-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              NL-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              OS-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              SE-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              US-NY-SPECIMEN:
                pattern: SPECIMEN-H[0-9]{2}-DL-[0-9]{4}
              US-NJ-SPECIMEN:
                pattern: SPECIMEN-H[0-9]{2}-DL-[0-9]{4}
              US-DE-SPECIMEN:
                pattern: SPECIMEN-H[0-9]{2}-DL-[0-9]{4}
              synthetic-registry:
                pattern: SYN-[A-Z]{2}-[A-Z0-9]{5,10}
              synthetic-free-zone-registry:
                pattern: SYN-[A-Z]{2}-FZ-[0-9]{6}
              synthetic-luhn:
                pattern: "[0-9]{8,19}"
                checksum: luhn
          industries:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: classifies every industry code in the corpus; individuals carry none, so the same map is harmless here."
            schemaVersion: 2.0.0
            value:
              metal_fabrication: manufacturing
              general_trading: wholesale_trade
              holding_company: holding_and_investment
              courier_services: transport_and_logistics
          permitted_providers:
            status: UNRESOLVED
            owner: installation.policy.owner
            reason: Supply reviewed installation policy content.
          profile_fields:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: legal name is the only profile field every individual corpus party carries."
            schemaVersion: 2.0.0
            value:
              - legal_name
          recommendations:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: maps control outcomes to review recommendations; no outcome recommends automatic acceptance."
            schemaVersion: 2.0.0
            value:
              PASS: REVIEW_FOR_ACCEPTANCE
              FAIL: ESCALATE
              UNKNOWN: COLLECT_EVIDENCE
          required_document_types:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: every handler treats this list as all-of, so identity and address alternatives live as any-of groups in the ehf.document extension (the kyc-v2 convention)."
            schemaVersion: 2.0.0
            value: []
          requirements:
            status: DERIVED
            owner: installation.policy.owner
            from: diligence
            base:
              owner: synthetic.policy.placeholder
              basis: "SYNTHETIC: obligation ids reuse domains/kyc/policy/catalog/evidence-obligations.yaml; EDD obligations apply only on a HIGH tier. Each control (decision.controls.assess) passes only on bound evidence: a document requirement listed and not missing, every identity verification passed, no screening candidate; a failed identity verification fails it, anything else stays UNKNOWN."
              value:
                - id: EVD-CIP-IDENTITY-DOCUMENT
                  description: "Synthetic: a government identity document"
                  control:
                    pass:
                      all:
                        - field: documents_required
                          op: contains
                          value: EVD-CIP-IDENTITY-DOCUMENT
                        - field: documents_missing
                          op: excludes
                          value: EVD-CIP-IDENTITY-DOCUMENT
                - id: EVD-CIP-ADDRESS
                  description: "Synthetic: evidence of residential address"
                  control:
                    pass:
                      all:
                        - field: documents_required
                          op: contains
                          value: EVD-CIP-ADDRESS
                        - field: documents_missing
                          op: excludes
                          value: EVD-CIP-ADDRESS
                - id: EVD-CIP-TIN
                  description: "Synthetic: evidence of the taxpayer identification number"
                  control:
                    pass:
                      all:
                        - field: documents_required
                          op: contains
                          value: EVD-CIP-TIN
                        - field: documents_missing
                          op: excludes
                          value: EVD-CIP-TIN
                - id: EVD-IDENTITY-VERIFICATION
                  description: "Synthetic: verified identity"
                  control:
                    pass:
                      all:
                        - field: identity_verified
                          op: contains
                          value: true
                        - field: identity_verified
                          op: excludes
                          value: false
                    fail:
                      field: identity_verified
                      op: contains
                      value: false
                - id: EVD-SANCTIONS-SCREENING
                  description: "Synthetic: sanctions screening disposed"
                  control:
                    pass:
                      field: sanctions_hits
                      op: eq
                      value: []
                - id: EVD-PEP-SCREENING
                  description: "Synthetic: PEP screening disposed"
                  control:
                    pass:
                      field: pep_hits
                      op: eq
                      value: []
                - id: EVD-ADVERSE-MEDIA
                  description: "Synthetic: adverse media screening disposed"
                  control:
                    pass:
                      field: adverse_media_events
                      op: eq
                      value: []
                - id: EVD-SOURCE-OF-FUNDS
                  description: "Synthetic: corroborated source of funds for high risk"
                  when:
                    field: tier
                    op: eq
                    value: HIGH
                  control:
                    pass:
                      all:
                        - field: funds_verified
                          op: contains
                          value: true
                        - field: funds_verified
                          op: excludes
                          value: false
                - id: EVD-EDD-NARRATIVE
                  description: "Synthetic: EDD narrative for high risk"
                  when:
                    field: tier
                    op: eq
                    value: HIGH
          review_interval_seconds:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: one-year periodic review; the schedule skill takes a single interval, so it cannot vary by tier."
            schemaVersion: 2.0.0
            value: 31536000
          risk_factor_maps:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: per-value scores covering every country, product, industry and customer type in the corpus, roughly in line with the corpus RiskFactor scores."
            schemaVersion: 2.0.0
            value:
              geography:
                US: "0.05"
                GB: "0.05"
                IE: "0.05"
                DE: "0.05"
                NL: "0.05"
                SE: "0.05"
                ES: "0.10"
                SG: "0.20"
                LU: "0.25"
                BG: "0.30"
                HK: "0.30"
                MX: "0.35"
                CY: "0.40"
                JE: "0.40"
                AE: "0.50"
                TR: "0.50"
                VG: "0.70"
                OS: "0.80"
              product:
                deposit: "0.05"
                card: "0.10"
                lending: "0.15"
                payments: "0.30"
                merchant_acquiring: "0.30"
                custody: "0.40"
                trade_finance: "0.50"
                private_banking: "0.50"
                correspondent: "0.60"
              industry:
                metal_fabrication: "0.20"
                courier_services: "0.40"
                general_trading: "0.55"
                holding_company: "0.60"
              behavior:
                baseline: "0.10"
              customer_type:
                individual: "0.05"
                private_company: "0.15"
                llc: "0.15"
                corporate: "0.20"
                trust: "0.40"
                free_zone_company: "0.50"
              pep_proximity:
                none: "0"
                unverified_associate: "0.40"
                verified_close_associate: "0.70"
                verified_family_member: "0.80"
                self: "1"
          risk_model_version:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: names the placeholder individual weighting below so risk assessments pin a model version."
            schemaVersion: 2.0.0
            value: synthetic-risk-individual-v1
          risk_tiers:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: boundaries chosen so the clean control (H01, 0.075) is LOW and the PEP-connected private-banking client (H03, 0.45) is HIGH."
            schemaVersion: 2.0.0
            value:
              - minimum: "0.40"
                tier: HIGH
              - minimum: "0.20"
                tier: MEDIUM
              - minimum: "0"
                tier: LOW
          risk_weights:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: equal weights on the only factors every individual corpus case carries; a weighted factor a case lacks leaves the score null."
            schemaVersion: 2.0.0
            value:
              geography: "0.5"
              product: "0.5"
          rules:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: rules use only the facts the flows bind (identity_verified, tier); a HIGH tier fails the standard-appetite rule and escalates."
            schemaVersion: 2.0.0
            value:
              - id: identity-verified
                predicate:
                  field: identity_verified
                  op: eq
                  value: true
              - id: risk-within-standard-appetite
                predicate:
                  field: tier
                  op: in
                  value:
                    - LOW
                    - MEDIUM
          screening_threshold:
            status: RESOLVED
            owner: installation.policy.owner
            basis: Inherited from pinned pack policy.pack.us.bank-synthetic.personal-banking (695b9ca88d117753d25a65abb8bf1c9a2238ffd4a0418988b31e5b4d18b48e2e); candidate until independently approved.
            schemaVersion: 2.0.0
            value: 0.85
          verification_methods:
            status: RESOLVED
            owner: installation.policy.owner
            basis: Inherited from pinned pack policy.pack.us.bank-synthetic.personal-banking (695b9ca88d117753d25a65abb8bf1c9a2238ffd4a0418988b31e5b4d18b48e2e); candidate until independently approved.
            schemaVersion: 2.0.0
            value:
              - government_id_document
              - registry_extract
