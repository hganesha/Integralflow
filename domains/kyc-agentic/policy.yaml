                          op: in
                          value:
                            - COMPLETED
                        - some:
                            path: /facts/selected/policyCaseClaims
                            fromInput: true
                            where:
                              all:
                                - path: /predicate
                                  op: eq
                                  value: agent_task_outcome
                                - path: /value/agent
                                  op: eq
                                  valueFromParent:
                                    depth: 1
                                    path: /value/agent
                                - path: /value/status
                                  op: in
                                  value:
                                    - COMPLETED
                                - path: /created_at
                                  op: after
                                  valueFromParent:
                                    depth: 1
                                    path: /created_at
            - every:
                path: /facts/selected/policyRecordScreeningHit
                allowEmpty: true
                where:
                  path: /__no_item_matches__
                  op: present
            - every:
                path: /facts/selected/policyRecordPEPRelationship
                allowEmpty: true
                where:
                  path: /__no_item_matches__
                  op: present
            - every:
                path: /facts/selected/policyRecordAdverseMediaEvent
                allowEmpty: true
                where:
                  path: /__no_item_matches__
                  op: present
            - every:
                path: /facts/selected/policyRecordFinding
                allowEmpty: true
                where:
                  path: /data/status
                  op: in
                  value:
                    - RESOLVED
                    - EXCULPATORY
            - every:
                path: /facts/selected/policyCaseContradictions
                allowEmpty: true
                where:
                  path: /status
                  op: in
                  value:
                    - RESOLVED
                    - ACCEPTED_RISK
                    - SUPERSEDED
            - every:
                path: /facts/selected/packScreening
                allowEmpty: false
                where:
                  path: /data/candidate_count
                  op: lte
                  value: 0
            - every:
                path: /facts/selected/policyRecordRiskFactor
                allowEmpty: false
                where:
                  path: /data/score
                  op: lte
                  valueFrom: /configuration/low_risk_max_factor_score
            - every:
                path: /facts/selected/policyRecordFraudSignal
                allowEmpty: true
                where:
                  any:
                    - path: /data/kind
                      op: ne
                      value: document_tamper
                    - path: /data/score
                      op: lte
                      valueFrom: /configuration/low_risk_max_factor_score
            - every:
                path: /facts/selected/policyCaseDecisionRecommendations
                allowEmpty: false
                where:
                  path: /outcome
                  op: ne
                  value: DECLINE
        result:
          state: DECIDED
          reasonCodes:
            - SYNTHETIC_LOW_RISK_APPROVED
          ruleIds: []
          actions:
            - kind: case_command
              commandType: FinalizeDisposition
              payload:
                outcome: APPROVED
                rationale: "Automatically approved as low risk under the SYNTHETIC checkpoint policy: every check complete and clear, every risk factor within the pack's ceiling."
          humanRequirement: null
          gaps: []
      - id: synthetic.disposition.dual-control
        when:
          all:
            - all:
                - every:
                    path: /facts/selected/policyCaseClaims
                    allowEmpty: true
                    where:
                      any:
                        - path: /predicate
                          op: ne
                          value: agent_task_outcome
                        - path: /value/status
                          op: in
                          value:
                            - COMPLETED
                            - NEEDS_REVIEW
                        - some:
                            path: /facts/selected/policyCaseClaims
                            fromInput: true
                            where:
                              all:
                                - path: /predicate
                                  op: eq
                                  value: agent_task_outcome
                                - path: /value/agent
                                  op: eq
                                  valueFromParent:
                                    depth: 1
                                    path: /value/agent
                                - path: /value/status
                                  op: in
                                  value:
                                    - COMPLETED
                                    - NEEDS_REVIEW
                                - path: /created_at
                                  op: after
                                  valueFromParent:
                                    depth: 1
                                    path: /created_at
            - path: /configuration/dual_control_required
              op: eq
              value: true
        result:
          state: NEEDS_HUMAN
          reasonCodes:
            - DUAL_CONTROL_REVIEW_REQUIRED
          ruleIds: []
          actions: []
          gaps: []
          humanRequirement:
            roles:
              - Case.Reviewer
            quorum: 2
            independentOfProposer: true
            allowedChoices:
              - APPROVE
              - REJECT
              - RETURN
            actionIntents:
              APPROVE:
                - kind: case_command
                  commandType: FinalizeDisposition
                  payload:
                    outcome: APPROVED
                    rationale: Approved by the required reviewers under the SYNTHETIC checkpoint policy.
              REJECT:
                - kind: case_command
                  commandType: FinalizeDisposition
                  payload:
                    outcome: DECLINED
                    rationale: Declined by the required reviewers under the SYNTHETIC checkpoint policy.
              RETURN: []
            ttlSeconds: 604800
      - id: synthetic.disposition.human-review
        when:
          all:
            - every:
                path: /facts/selected/policyCaseClaims
                allowEmpty: true
                where:
                  any:
                    - path: /predicate
                      op: ne
                      value: agent_task_outcome
                    - path: /value/status
                      op: in
                      value:
                        - COMPLETED
                        - NEEDS_REVIEW
                    - some:
                        path: /facts/selected/policyCaseClaims
                        fromInput: true
                        where:
                          all:
                            - path: /predicate
                              op: eq
                              value: agent_task_outcome
                            - path: /value/agent
                              op: eq
                              valueFromParent:
                                depth: 1
                                path: /value/agent
                            - path: /value/status
                              op: in
                              value:
                                - COMPLETED
                                - NEEDS_REVIEW
                            - path: /created_at
                              op: after
                              valueFromParent:
                                depth: 1
                                path: /created_at
        result:
          state: NEEDS_HUMAN
          reasonCodes:
            - HUMAN_REVIEW_REQUIRED
          ruleIds: []
          actions: []
          gaps: []
          humanRequirement:
            roles:
              - Case.Reviewer
            quorum: 1
            independentOfProposer: true
            allowedChoices:
              - APPROVE
              - REJECT
              - RETURN
            actionIntents:
              APPROVE:
                - kind: case_command
                  commandType: FinalizeDisposition
                  payload:
                    outcome: APPROVED
                    rationale: Approved by the required reviewers under the SYNTHETIC checkpoint policy.
              REJECT:
                - kind: case_command
                  commandType: FinalizeDisposition
                  payload:
                    outcome: DECLINED
                    rationale: Declined by the required reviewers under the SYNTHETIC checkpoint policy.
              RETURN: []
            ttlSeconds: 604800
    otherwise:
      state: NEEDS_EVIDENCE
      reasonCodes:
        - AGENT_TASK_INCOMPLETE
      ruleIds: []
      actions: []
      humanRequirement: null
      gaps:
        - code: AGENT_TASK_INCOMPLETE
          path: /facts/selected/policyCaseClaims
          subjectId: null
diligence:
  levels:
    - SDD
    - CDD
    - EDD
  simplifiedLevel: SDD
  gateId: diligence-level
  inputProfile: canonical.onboarding.v2
  inputs:
    legalForm: /scope/legalForm
  partyTypes:
    - id: individual
      label: Individual
      customerType: individual
      legalForms:
        - individual
  products:
    - card
    - deposit
    - payments
  productAliases:
    card: PAY.CARDS
    deposit: DEP
    payments: PAY
  matrix:
    individual:
      card: CDD
      deposit: SDD
      payments: CDD
  overlays:
    - id: overlay.pep
      label: Politically exposed person
      description: A verified PEP relationship, or an open PEP signal on the case.
      enabled: true
      requires:
        - /facts/selected/policyRecordPEPRelationship
        - /facts/selected/policyCaseFindings
      when:
        any:
          - some:
              path: /facts/selected/policyRecordPEPRelationship
              where:
                path: /data/verified
                op: eq
                value: true
          - some:
              path: /facts/selected/policyCaseFindings
              where:
                all:
                  - path: /findingType
                    op: eq
                    value: PEP_SIGNAL
                  - path: /status
                    op: eq
                    value: OPEN
      effect:
        escalateTo: EDD
        requireApproval:
          role: Case.Reviewer
          quorum: 2
          reason: Senior approval to establish a relationship with a politically exposed person (candidate - two case reviewers until a senior-management role exists).
    - id: overlay.high-risk-geography
      label: High-risk geography
      description: Exposure to a country on the institution's high-risk list (candidate list from the FATF call for action; the owner maintains it).
      enabled: true
      requires:
        - /facts/selected/policyRecordGeographyExposure
      when:
        some:
          path: /facts/selected/policyRecordGeographyExposure
          where:
            path: /data/country
            op: in
            value:
              - IR
              - KP
              - MM
      effect:
        escalateBy: 1
    - id: overlay.complex-ownership
      label: Complex or opaque ownership
      description: Three or more recorded ownership interests.
      enabled: true
      requires:
        - /facts/selected/packOwnership
      when:
        path: /facts/selected/packOwnership
        op: count_gte
        value: 3
      effect:
        escalateTo: EDD
    - id: overlay.adverse-media
      label: Confirmed adverse media
      description: A confirmed adverse-media event about the customer or a connected party.
      enabled: false
      requires:
        - /facts/selected/policyRecordAdverseMediaEvent
      when:
        some:
          path: /facts/selected/policyRecordAdverseMediaEvent
          where:
            path: /data/status
            op: eq
            value: CONFIRMED
      effect:
        escalateTo: EDD
        addRequirements:
          - EVD-PUBLIC-SOURCE-RESEARCH
    - id: overlay.high-transaction-risk
      label: High transactional risk
      description: A transaction risk factor scored 0.7 or more, for payment products (cards, merchant acquiring and payments).
      enabled: false
      appliesTo:
        products:
          - PAY
      requires:
        - /facts/selected/policyRecordRiskFactor
      when:
        some:
          path: /facts/selected/policyRecordRiskFactor
          where:
            all:
              - path: /data/name
                op: eq
                value: transaction
              - path: /data/score
                op: gte
                value: "0.7"
      effect:
        escalateBy: 1
    - id: overlay.assessed-high-risk
      label: Assessed high risk
      description: The case's assessed risk tier is HIGH. Off until the risk skills' tier reaches this gate; simulate it with the what-if's assessed-risk input.
      enabled: false
      requires:
        - /facts/assessedRisk/tier
      when:
        path: /facts/assessedRisk/tier
        op: eq
        value: HIGH
      effect:
        escalateTo: EDD
  roleRequirements:
    AUTHORIZED_USER:
      - EVD-CIP-IDENTITY-DOCUMENT
      - EVD-SANCTIONS-SCREENING
  screening:
    sanctions: EVD-SANCTIONS-SCREENING
    pep: EVD-PEP-SCREENING
    adverse_media: EVD-ADVERSE-MEDIA
  requirements:
    SDD:
      - EVD-CIP-IDENTITY-DOCUMENT
      - EVD-SANCTIONS-SCREENING
    CDD:
      - EVD-CIP-IDENTITY-DOCUMENT
      - EVD-SANCTIONS-SCREENING
      - EVD-CIP-ADDRESS
      - EVD-IDENTITY-VERIFICATION
      - EVD-PEP-SCREENING
      - EVD-RELATIONSHIP-PURPOSE
      - EVD-BENEFICIAL-OWNERSHIP
    EDD:
      - EVD-CIP-IDENTITY-DOCUMENT
      - EVD-SANCTIONS-SCREENING
      - EVD-CIP-ADDRESS
      - EVD-IDENTITY-VERIFICATION
      - EVD-PEP-SCREENING
      - EVD-RELATIONSHIP-PURPOSE
      - EVD-BENEFICIAL-OWNERSHIP
      - EVD-ADVERSE-MEDIA
      - EVD-SOURCE-OF-FUNDS
      - EVD-EDD-NARRATIVE
