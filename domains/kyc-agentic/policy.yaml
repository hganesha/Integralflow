    inputProfile: canonical.onboarding.v2
    rules:
      - id: synthetic.disposition.review-conflict
        when:
          path: /facts/humanReview/conflict
          op: eq
          value: true
        result:
          state: NEEDS_HUMAN
          reasonCodes:
            - REVIEWERS_DISAGREE
          ruleIds: []
          actions: []
          gaps: []
          humanRequirement:
            roles:
              - Case.Reviewer
            quorum: 2
            independentOfProposer: true
            allowedChoices:
              - APPROVE
              - REJECT
              - RETURN
            actionIntents:
              APPROVE:
                - kind: case_command
                  commandType: FinalizeDisposition
                  payload:
                    outcome: APPROVED
                    rationale: Approved by the required reviewers under the SYNTHETIC checkpoint policy.
              REJECT:
                - kind: case_command
