apiVersion: harness.factory/business-policy-v2
kind: BusinessPolicy
metadata:
  id: policy.securities-agentic.business.v2
  version: 2.0.0
  owner: installation.policy.owner
decisionTtlSeconds: 60
policySets:
  - id: policy.pack.us.securities-synthetic.institutional-securities.v2
    version: 2.0.0
    status: CANDIDATE
    packPin:
      id: policy.pack.us.securities-synthetic.institutional-securities
      digest: 18859fddccc295f8220694a78c7599aca62e20967430829b66e06e23cae4a3e0
    scope:
      jurisdiction: US
      institution: securities.synthetic
      products:
        - BRK
        - CUS
        - WLT
      customerTypes:
        - corporate
      purposes:
        - CDD_ONBOARDING
    modules:
      - id: pack.baseline
        version: 1.0.0
        digest: 60b111d1c4758de9139dea0b7e3abe2fe2dfd51f277717cc6fb025662fa7c43d
      - id: pack.jurisdiction.us
        version: 1.0.0
        digest: 8dc5725a231e03844b9ef06701b30436432b1d63da9dc72229cb64907d7e30fd
      - id: pack.institution.securities-synthetic
        version: 1.0.0
        digest: b250456cbbf36e2a1007300ed17723767195c76e3837b48b625fb09962045fca
      - id: pack.product.family.brk
        version: 1.0.0
        digest: 179df7ebed879e69e7ffdfab25c3016e39d296ae8ccaad3ce6b8d938e568fbac
      - id: pack.product.family.cus
        version: 1.0.0
        digest: e4c38fcd41c69f2f6632711a136f9faefc95566c2a7561c58c032a3de7340bb1
      - id: pack.product.family.wlt
        version: 1.0.0
        digest: ddcbd1a0f9939f53206cdf335429fb9a3849e7ef0a93d6d2997229254aa0b5f1
    configuration:
      jurisdiction: US
      screening_threshold: 0.85
      ownership_threshold: "0.25"
      sanctions_ownership:
        rule: ofac_50_percent
        threshold: "0.5"
      control_bases:
        - appoint_board
        - voting_majority
      sanctions_control_bases:
        - voting_majority
      verification_methods:
        - government_id_document
        - registry_extract
      active_registry_statuses:
        - ACTIVE
      freshness_seconds:
        VerificationRecord: 7776000
        WatchlistEntry: 86400
      required_screening_types:
        - adverse_media
        - pep
        - sanctions
      required_screening_lists:
        - ofac-sdn
      screening_roles:
        - attorney
        - beneficial_owner
        - control_person
        - customer
        - director
        - signatory
      pep_scope: foreign
      required_party_roles:
        corporate:
          - beneficial_owner
          - customer
        individual:
          - customer
      dual_control_required: true
      automatic_approval_enabled: false
      automatic_decline_enabled: false
      diligence_floors: {}
      mandatory_overlays: []
      simplified_due_diligence_permitted: false
      content:
        apiVersion: harness.factory/installation-policy-content-v2
        requiredFields:
          - active_registry_statuses
          - control_bases
          - customer_types
          - edd_triggers
          - extensions
          - freshness_seconds
          - identifier_rules
          - industries
          - ownership_threshold
          - permitted_providers
          - profile_fields
          - recommendations
          - required_document_types
          - requirements
          - review_interval_seconds
          - risk_factor_maps
          - risk_model_version
          - risk_tiers
          - risk_weights
          - rules
          - sanctions_control_bases
          - sanctions_ownership
          - screening_threshold
          - verification_methods
        fields:
          active_registry_statuses:
            status: RESOLVED
            owner: installation.policy.owner
            basis: Inherited from pinned pack policy.pack.us.securities-synthetic.institutional-securities (18859fddccc295f8220694a78c7599aca62e20967430829b66e06e23cae4a3e0); candidate until independently approved.
            schemaVersion: 2.0.0
            value:
              - ACTIVE
          control_bases:
            status: RESOLVED
            owner: installation.policy.owner
            basis: Inherited from pinned pack policy.pack.us.securities-synthetic.institutional-securities (18859fddccc295f8220694a78c7599aca62e20967430829b66e06e23cae4a3e0); candidate until independently approved.
            schemaVersion: 2.0.0
            value:
              - appoint_board
              - voting_majority
          customer_types:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: maps corpus customer_type codes onto the flows' two customer types (individual -> KYC, everything else -> KYB)."
            schemaVersion: 2.0.0
            value:
              individual: individual
              sole_proprietor: corporate
              private_company: corporate
              corporate: corporate
              llc: corporate
              free_zone_company: corporate
              listed_company: corporate
              partnership: corporate
              trust: corporate
          edd_triggers:
            status: DERIVED
            owner: installation.policy.owner
            from: diligence
            base:
              owner: synthetic.policy.placeholder
              basis: "SYNTHETIC: the flows bind the tier and the sanctions, PEP and adverse-media screening outcomes; any HIGH tier or any screening candidate or adverse-media event requires EDD, with tasks scoping the ownership review."
              value:
                - id: edd-high-risk-tier
                  predicate:
                    field: tier
                    op: eq
                    value: HIGH
                  tasks:
                    - ownership_structure_verification
                    - ubo_sanctions_and_pep_review
                    - source_of_funds
                    - business_purpose_validation
                    - senior_management_approval
                    - enhanced_ongoing_monitoring
                - id: edd-pep-candidate
                  predicate:
                    field: pep_hits
                    op: ne
                    value: []
                  tasks:
                    - ubo_sanctions_and_pep_review
                    - senior_management_approval
                - id: edd-sanctions-candidate
                  predicate:
                    field: sanctions_hits
                    op: ne
                    value: []
                  tasks:
                    - sanctions_match_review
                    - ownership_structure_verification
                    - senior_management_approval
                - id: edd-adverse-media
                  predicate:
                    field: adverse_media_events
                    op: ne
                    value: []
                  tasks:
                    - adverse_media_review
          extensions:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: any-of document groups in document field catalog vocabulary (certificate_of_incorporation, company_registry_extract, ...), as document.requirements.resolve reads them."
            schemaVersion: 2.0.0
            value:
              ehf.document:
                schema_version: 1.0.0
                value:
                  document_requirements:
                    - id: EVD-BUSINESS-REGISTRATION
                      description: "Synthetic: evidence of legal existence"
                      any_of:
                        - certificate_of_incorporation
                        - company_registry_extract
                        - business_registration_certificate
                        - certificate_of_good_standing
                        - trust_deed
                        - trust_registration
                        - partnership_agreement
                        - llc_operating_agreement
                    - id: EVD-BENEFICIAL-OWNERSHIP
                      description: "Synthetic: evidence of ownership"
                      any_of:
                        - shareholder_register
                        - beneficial_ownership_declaration
                        - beneficial_ownership_registry_extract
                        - ownership_structure_chart
                        - trust_deed
                    - id: SYN-CONTROL-AND-OFFICERS
                      description: "Synthetic: evidence of directors, officers or trustees"
                      any_of:
                        - director_officer_register
                        - certificate_of_incumbency
                        - officeholder_list
                        - trustee_appointment_deed
                    - id: EVD-CIP-TIN
                      description: "Synthetic: entity taxpayer identification number evidence"
                      any_of:
                        - tax_registration_certificate
                        - entity_tax_self_certification
                        - w9
                        - w8bene
          freshness_seconds:
            status: RESOLVED
            owner: installation.policy.owner
            basis: Inherited from pinned pack policy.pack.us.securities-synthetic.institutional-securities (18859fddccc295f8220694a78c7599aca62e20967430829b66e06e23cae4a3e0); candidate until independently approved.
            schemaVersion: 2.0.0
            value:
              VerificationRecord: 7776000
              WatchlistEntry: 86400
          identifier_rules:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: the same issuer-keyed specimen patterns as individuals, covering owners' and officers' documents and the synthetic registries."
            schemaVersion: 2.0.0
            value:
              US-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              GB-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              BG-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              CY-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              DE-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              ES-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              LU-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              MX-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              NL-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              OS-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              SE-SPECIMEN:
                pattern: SPECIMEN-(?:H[0-9]{2}-(?:PP|DL|DNI|CURP|ID)|SD|PEP)-[0-9]{4}
              US-NY-SPECIMEN:
                pattern: SPECIMEN-H[0-9]{2}-DL-[0-9]{4}
              US-NJ-SPECIMEN:
                pattern: SPECIMEN-H[0-9]{2}-DL-[0-9]{4}
              US-DE-SPECIMEN:
                pattern: SPECIMEN-H[0-9]{2}-DL-[0-9]{4}
              synthetic-registry:
                pattern: SYN-[A-Z]{2}-[A-Z0-9]{5,10}
              synthetic-free-zone-registry:
                pattern: SYN-[A-Z]{2}-FZ-[0-9]{6}
              synthetic-luhn:
                pattern: "[0-9]{8,19}"
                checksum: luhn
          industries:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: classifies every industry code on a corporate corpus party."
            schemaVersion: 2.0.0
            value:
              metal_fabrication: manufacturing
              general_trading: wholesale_trade
              holding_company: holding_and_investment
              courier_services: transport_and_logistics
          ownership_threshold:
            status: RESOLVED
            owner: installation.policy.owner
            basis: Inherited from pinned pack policy.pack.us.securities-synthetic.institutional-securities (18859fddccc295f8220694a78c7599aca62e20967430829b66e06e23cae4a3e0); candidate until independently approved.
            schemaVersion: 2.0.0
            value: "0.25"
          permitted_providers:
            status: UNRESOLVED
            owner: installation.policy.owner
            reason: Supply reviewed installation policy content.
          profile_fields:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: legal name and declared business purpose; the trust H12 carries no business_purpose and reports it as a gap."
            schemaVersion: 2.0.0
            value:
              - legal_name
              - business_purpose
          recommendations:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: maps control outcomes to review recommendations; no outcome recommends automatic acceptance."
            schemaVersion: 2.0.0
            value:
              PASS: REVIEW_FOR_ACCEPTANCE
              FAIL: ESCALATE
              UNKNOWN: COLLECT_EVIDENCE
          required_document_types:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: every handler treats this list as all-of and trusts have no certificate of incorporation, so alternatives live as any-of groups in the ehf.document extension."
            schemaVersion: 2.0.0
            value: []
          requirements:
            status: DERIVED
            owner: installation.policy.owner
            from: diligence
            base:
              owner: synthetic.policy.placeholder
              basis: "SYNTHETIC: obligation ids reuse domains/kyc/policy/catalog/evidence-obligations.yaml plus the KYB ownership and registration obligations; EDD obligations apply only on a HIGH tier and ownership not under simplified due diligence. Each control (decision.controls.assess) passes only on bound evidence (documents, registry or owner verifications, profile completeness, screening without candidates); a failed identity verification fails it, anything else stays UNKNOWN."
              value:
                - id: EVD-BUSINESS-REGISTRATION
                  description: "Synthetic: evidence of legal existence and registration"
                  control:
                    pass:
                      any:
                        - all:
                            - field: documents_required
                              op: contains
                              value: EVD-BUSINESS-REGISTRATION
                            - field: documents_missing
                              op: excludes
                              value: EVD-BUSINESS-REGISTRATION
                        - all:
                            - field: registry_verified
                              op: contains
                              value: true
                            - field: registry_verified
                              op: excludes
                              value: false
                - id: EVD-BENEFICIAL-OWNERSHIP
                  description: "Synthetic: beneficial owners identified and verified"
                  when:
                    field: due_diligence
                    op: ne
                    value: simplified
                  control:
                    pass:
                      all:
                        - field: owners_verified
                          op: contains
                          value: true
                        - field: owners_verified
                          op: excludes
                          value: false
                - id: EVD-RELATIONSHIP-PURPOSE
                  description: "Synthetic: declared business purpose and expected activity"
                  control:
                    pass:
                      all:
                        - field: profile_complete
                          op: contains
                          value: true
                        - field: profile_complete
                          op: excludes
                          value: false
                - id: EVD-CIP-ADDRESS
                  description: "Synthetic: principal business address evidence"
                  control:
                    pass:
                      all:
                        - field: documents_required
                          op: contains
                          value: EVD-CIP-ADDRESS
                        - field: documents_missing
                          op: excludes
                          value: EVD-CIP-ADDRESS
                - id: EVD-CIP-TIN
                  description: "Synthetic: employer or taxpayer identification number evidence"
                  control:
                    pass:
                      all:
                        - field: documents_required
                          op: contains
                          value: EVD-CIP-TIN
                        - field: documents_missing
                          op: excludes
                          value: EVD-CIP-TIN
                - id: EVD-IDENTITY-VERIFICATION
                  description: "Synthetic: controllers' identity verified"
                  control:
                    pass:
                      all:
                        - field: identity_verified
                          op: contains
                          value: true
                        - field: identity_verified
                          op: excludes
                          value: false
                    fail:
                      field: identity_verified
                      op: contains
                      value: false
                - id: EVD-SANCTIONS-SCREENING
                  description: "Synthetic: entity, owner and controller sanctions screening disposed"
                  control:
                    pass:
                      field: sanctions_hits
                      op: eq
                      value: []
                - id: EVD-PEP-SCREENING
                  description: "Synthetic: owner and controller PEP screening disposed"
                  control:
                    pass:
                      field: pep_hits
                      op: eq
                      value: []
                - id: EVD-ADVERSE-MEDIA
                  description: "Synthetic: adverse media screening disposed"
                  control:
                    pass:
                      field: adverse_media_events
                      op: eq
                      value: []
                - id: EVD-SOURCE-OF-FUNDS
                  description: "Synthetic: corroborated source of funds for high risk"
                  when:
                    field: tier
                    op: eq
                    value: HIGH
                  control:
                    pass:
                      all:
                        - field: funds_verified
                          op: contains
                          value: true
                        - field: funds_verified
                          op: excludes
                          value: false
                - id: EVD-EDD-NARRATIVE
                  description: "Synthetic: EDD narrative for high risk"
                  when:
                    field: tier
                    op: eq
                    value: HIGH
          review_interval_seconds:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: one-year periodic review; the schedule skill takes a single interval, so it cannot vary by tier."
            schemaVersion: 2.0.0
            value: 31536000
          risk_factor_maps:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: the same per-value score tables as individuals; industry and customer type scores matter only here."
            schemaVersion: 2.0.0
            value:
              geography:
                US: "0.05"
                GB: "0.05"
                IE: "0.05"
                DE: "0.05"
                NL: "0.05"
                SE: "0.05"
                ES: "0.10"
                SG: "0.20"
                LU: "0.25"
                BG: "0.30"
                HK: "0.30"
                MX: "0.35"
                CY: "0.40"
                JE: "0.40"
                AE: "0.50"
                TR: "0.50"
                VG: "0.70"
                OS: "0.80"
              product:
                deposit: "0.05"
                card: "0.10"
                lending: "0.15"
                payments: "0.30"
                merchant_acquiring: "0.30"
                custody: "0.40"
                trade_finance: "0.50"
                private_banking: "0.50"
                correspondent: "0.60"
              industry:
                metal_fabrication: "0.20"
                courier_services: "0.40"
                general_trading: "0.55"
                holding_company: "0.60"
              behavior:
                baseline: "0.10"
              customer_type:
                individual: "0.05"
                private_company: "0.15"
                llc: "0.15"
                corporate: "0.20"
                trust: "0.40"
                free_zone_company: "0.50"
              pep_proximity:
                none: "0"
                unverified_associate: "0.40"
                verified_close_associate: "0.70"
                verified_family_member: "0.80"
                self: "1"
          risk_model_version:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: names the placeholder corporate weighting below so risk assessments pin a model version."
            schemaVersion: 2.0.0
            value: synthetic-risk-corporate-v1
          risk_tiers:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: with the corporate weights, clean corporates H04 (0.16) and H07 (0.11) are LOW, trust H12 (0.28) MEDIUM, H05 and H06 (0.47, 0.48) HIGH."
            schemaVersion: 2.0.0
            value:
              - minimum: "0.40"
                tier: HIGH
              - minimum: "0.20"
                tier: MEDIUM
              - minimum: "0"
                tier: LOW
          risk_weights:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: only geography and product are on every corporate case (the trust H12 lacks ownership_structure), so ownership risk is not weighted."
            schemaVersion: 2.0.0
            value:
              geography: "0.6"
              product: "0.4"
          rules:
            status: RESOLVED
            owner: synthetic.policy.placeholder
            basis: "SYNTHETIC: rules use only the facts the flows bind (identity_verified, tier); a HIGH tier fails the standard-appetite rule and escalates."
            schemaVersion: 2.0.0
            value:
              - id: identity-verified
                predicate:
                  field: identity_verified
                  op: eq
                  value: true
              - id: risk-within-standard-appetite
                predicate:
                  field: tier
                  op: in
                  value:
                    - LOW
                    - MEDIUM
          sanctions_control_bases:
            status: RESOLVED
            owner: installation.policy.owner
            basis: Inherited from pinned pack policy.pack.us.securities-synthetic.institutional-securities (18859fddccc295f8220694a78c7599aca62e20967430829b66e06e23cae4a3e0); candidate until independently approved.
            schemaVersion: 2.0.0
            value:
              - voting_majority
          sanctions_ownership:
            status: RESOLVED
            owner: installation.policy.owner
            basis: Inherited from pinned pack policy.pack.us.securities-synthetic.institutional-securities (18859fddccc295f8220694a78c7599aca62e20967430829b66e06e23cae4a3e0); candidate until independently approved.
            schemaVersion: 2.0.0
            value:
              rule: ofac_50_percent
              threshold: "0.5"
          screening_threshold:
            status: RESOLVED
            owner: installation.policy.owner
            basis: Inherited from pinned pack policy.pack.us.securities-synthetic.institutional-securities (18859fddccc295f8220694a78c7599aca62e20967430829b66e06e23cae4a3e0); candidate until independently approved.
            schemaVersion: 2.0.0
            value: 0.85
          verification_methods:
            status: RESOLVED
            owner: installation.policy.owner
            basis: Inherited from pinned pack policy.pack.us.securities-synthetic.institutional-securities (18859fddccc295f8220694a78c7599aca62e20967430829b66e06e23cae4a3e0); candidate until independently approved.
            schemaVersion: 2.0.0
            value:
              - government_id_document
              - registry_extract
gates:
  intake-ready:
    inputProfile: canonical.onboarding.v2
    rules:
      - id: synthetic.intake.ready
        when:
          all:
            - path: /facts/selected/packRelationship
              op: count_gte
              value: 1
            - all:
                - every:
                    path: /facts/selected/policyCaseClaims
                    allowEmpty: true
                    where:
                      any:
                        - path: /predicate
                          op: ne
                          value: agent_task_outcome
                        - path: /value/status
                          op: in
                          value:
                            - COMPLETED
                            - NEEDS_REVIEW
                        - some:
                            path: /facts/selected/policyCaseClaims
                            fromInput: true
                            where:
                              all:
                                - path: /predicate
                                  op: eq
                                  value: agent_task_outcome
                                - path: /value/agent
                                  op: eq
                                  valueFromParent:
                                    depth: 1
                                    path: /value/agent
                                - path: /value/status
                                  op: in
                                  value:
                                    - COMPLETED
                                    - NEEDS_REVIEW
                                - path: /created_at
                                  op: after
                                  valueFromParent:
                                    depth: 1
                                    path: /created_at
        result:
          state: DECIDED
          reasonCodes:
            - SYNTHETIC_INTAKE_READY
          ruleIds: []
          actions: []
          humanRequirement: null
          gaps: []
      - id: synthetic.intake.relationship-missing
        when:
          every:
            path: /facts/selected/packRelationship
            allowEmpty: true
            where:
              path: /__no_item_matches__
              op: present
        result:
          state: NEEDS_EVIDENCE
          reasonCodes:
            - BANKING_RELATIONSHIP_MISSING
          ruleIds: []
          actions: []
          humanRequirement: null
          gaps:
            - code: BANKING_RELATIONSHIP_MISSING
              path: /facts/selected/packRelationship
              subjectId: null
      - id: synthetic.intake.agent-task-incomplete
        when:
          some:
            path: /facts/selected/policyCaseClaims
            where:
              all:
                - path: /predicate
                  op: eq
                  value: agent_task_outcome
                - path: /value/status
                  op: ne
                  value: COMPLETED
                - path: /value/status
                  op: ne
                  value: NEEDS_REVIEW
        result:
          state: NEEDS_EVIDENCE
          reasonCodes:
            - AGENT_TASK_INCOMPLETE
          ruleIds: []
          actions: []
          humanRequirement: null
          gaps:
            - code: AGENT_TASK_INCOMPLETE
              path: /facts/selected/policyCaseClaims
              subjectId: null
    otherwise:
      state: NEEDS_EVIDENCE
      reasonCodes:
        - BANKING_RELATIONSHIP_MISSING
      ruleIds: []
      actions: []
      humanRequirement: null
      gaps:
        - code: BANKING_RELATIONSHIP_MISSING
          path: /facts/selected/packRelationship
          subjectId: null
  decision-ready:
    inputProfile: canonical.onboarding.v2
    rules:
      - id: synthetic.decision.edd-escalation
        when:
          some:
            path: /facts/selected/policyCaseClaims
            where:
              path: /predicate
              op: eq
              value: edd_required
        result:
          state: NEEDS_EVIDENCE
          reasonCodes:
            - EDD_ESCALATION_REQUIRED
          ruleIds: []
          actions:
            - kind: case_command
              commandType: ProposeWorkItem
              payload:
                workItemId: edd-escalation
                workType: EDD_ESCALATION
                priority: HIGH
