apiVersion: harness.factory/policy-pack-layer-v1
kind: PolicyPackLayer
metadata:
  id: pack.product.family.pay
  version: 1.0.0
  layer: product
  # A taxonomy node: every payments product beneath PAY inherits this layer (cards, merchant
  # acquiring and payments today), and a product's own layer may only tighten it.
  appliesTo: { products: [PAY] }
  status: CANDIDATE
  ownerRole: kyb-policy-owner
  description: The payments family; whoever can instruct payments is screened.
values:
  screening_roles:
    value: [customer, beneficial_owner, control_person, director, signatory, trustee, settlor, protector, beneficiary, attorney]
    basis: { text: "Anyone holding a power of attorney over a payment account or card can move funds and is screened." }
