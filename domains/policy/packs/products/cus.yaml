apiVersion: harness.factory/policy-pack-layer-v1
kind: PolicyPackLayer
metadata:
  id: pack.product.family.cus
  version: 1.0.0
  layer: product
  # A taxonomy node: every custody product beneath CUS inherits this layer.
  appliesTo: { products: [CUS] }
  status: CANDIDATE
  ownerRole: kyb-policy-owner
  description: The custody family; holding a client's assets calls for adverse media screening as well.
values:
  required_screening_types:
    value: [sanctions, pep, adverse_media]
    basis: { text: "Firm appetite: a custodian holds the client's assets, so negative news about the client is searched before onboarding." }
