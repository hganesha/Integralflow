apiVersion: harness.factory/policy-pack-layer-v1
kind: PolicyPackLayer
metadata:
  id: pack.product.family.brk
  version: 1.0.0
  layer: product
  # A taxonomy node: every brokerage product beneath BRK (retail, prime, financing) inherits this layer.
  appliesTo: { products: [BRK] }
  status: CANDIDATE
  ownerRole: kyb-policy-owner
  description: The brokerage family; whoever can place orders on the account is screened.
values:
  screening_roles:
    value: [customer, beneficial_owner, control_person, director, signatory, attorney]
    basis: { text: "An authorised trader or attorney can place orders and move securities on the account, so is screened." }
