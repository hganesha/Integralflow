    - id: screening-ready
      kind: gate
      name: Screening readiness gate (OPA)
      summary: "Before screening: pinned policy authority, claim digest and CIP attributes on the canonical case. Anything but ALLOW ends the run."
      contextSelectorIds:
        - policyGateContext
      config:
        policyRef: policy.kyc.customer-acceptance.v1
        gateId: screening-ready
        caseWriteActor: system
        caseWritePrincipalId: policy-gate
        caseWrites:
          - commandType: TransitionCaseStatus
            when: output.outcome == "ALLOW"
            payload:
              toStatus: SCREENING
              reason: Screening readiness policy gate allowed the case to proceed.
            payloadSchema:
              type: object
              required:
                - toStatus
                - reason
    - id: acquire-sanctions
      kind: tool
      name: OpenSanctions sanctions screen
      summary: Acquire through opensanctions:sanctions; write the normalized WatchlistEntry, ScreeningHit or NegativeSearchEvidence records, or an incomplete-check finding when the check established nothing.
      contextSelectorIds:
        - screeningSubjects
      capabilities:
        tools:
          - screening.sanctions.v1
      config:
        subjectAcquisition:
          subjectsSelector: screeningSubjects
          maxSubjects: 50
        evidenceCapture:
          type: kyc_acquire_sanctions
          sourceType: TOOL
          trustTier: VERIFIED_PROVIDER
          instructionTrust: UNTRUSTED_EXTERNAL
        caseWriteActor: system
        caseWritePrincipalId: kyc-connector-normalizer
        caseWrites:
          - commandType: LinkEvidence
            payload:
              evidenceId: "{{ evidence.evidenceId }}"
              purpose: KYC_SANCTIONS_SCREENING
            payloadSchema:
              type: object
              required:
                - evidenceId
                - purpose
          - commandType: RecordCanonicalRecords
            when: output.records.0
            payload:
              records: "{{ output.records }}"
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
            payloadSchema:
              type: object
              required:
                - records
                - evidenceRefs
          - commandType: RecordScreeningFinding
            when: output.recordGap
            payload:
              findingId: finding_sanctions_screen_incomplete_acquire_sanctions_{{ run.runId }}
              findingType: SANCTIONS_SCREEN_INCOMPLETE
              classification: REVIEW
              confidence:
                value: 1
                method: connector_outcome
              reason: "{{ output.recordGap.reason }}"
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
              factRefs: []
              policyRelevance: KYC-SCR-002
            payloadSchema:
              type: object
              required:
                - findingId
                - findingType
                - reason
                - evidenceRefs
          - commandType: RecordScreeningFinding
            when: output.alerts.0
            payload:
              findingId: finding_possible_sanctions_match_acquire_sanctions_{{ run.runId }}
              findingType: POSSIBLE_SANCTIONS_MATCH
              classification: REVIEW
              confidence:
                value: 0.8
                method: connector_outcome
              reason: OpenSanctions returned at least one sanctions or linked-entity candidate.
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
              factRefs: []
              policyRelevance: KYC-SCR-003
            payloadSchema:
              type: object
              required:
                - findingId
                - findingType
                - reason
                - evidenceRefs
