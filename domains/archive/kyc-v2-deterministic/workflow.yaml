apiVersion: ladder.dev/v1alpha1
kind: Workflow
metadata:
  name: kyc-cdd-onboarding
  title: Individual KYC (skill library)
  description: CDD onboarding on library skills, with connector acquisition stages, OPA decision-table gates and durable dual-control approval.
  version: 3.0.0
spec:
  objective: Produce an auditable KYC case from canonical records and library reasoning, never claiming more than the records establish and never granting a skill or provider disposition authority.
  inputs:
    type: object
    required:
      - tenantId
      - caseId
    properties:
      tenantId:
        type: string
      caseId:
        type: string
  outputs:
    type: object
  policies:
    maxConcurrency: 5
    onFailure: stop
  nodes:
    - id: intake
      kind: input
      name: KYC case identity
      summary: Accept only tenant and case identity; the subject, records and policy authority come from the canonical case store.
    - id: policy-authority
      kind: transform
      name: Pin policy authority evidence
      summary: Materialize the case's immutable policy binding as authoritative canonical evidence and a policy claim; the screening-ready gate checks both.
      contextSelectorIds:
        - policyGateContext
      config:
        operation: select
        path: /
        caseWriteActor: system
        caseWritePrincipalId: kyc-policy-context
        evidenceCapture:
          type: kyc_policy_authority_binding
          sourceType: INTERNAL_SYSTEM
          trustTier: AUTHORITATIVE_POLICY
          instructionTrust: TRUSTED
        caseWrites:
          - commandType: LinkEvidence
            payload:
              evidenceId: "{{ evidence.evidenceId }}"
              purpose: KYC_POLICY_AUTHORITY
            payloadSchema:
              type: object
              required:
                - evidenceId
                - purpose
          - commandType: ProposeClaim
            payload:
              claimId: claim_policy_{{ run.runId }}
              predicate: applicable_kyc_policy
              value:
                policyId: "{{ case.policyAuthority.policyId }}"
                policyVersion: "{{ case.policyAuthority.policyVersion }}"
                policySnapshotDigest: "{{ case.policyAuthority.policySnapshotDigest }}"
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
              confidence:
                value: 1
                method: release_binding
            payloadSchema:
              type: object
              required:
                - claimId
                - predicate
                - value
                - evidenceRefs
          - commandType: TransitionCaseStatus
            payload:
              toStatus: VALIDATING
              reason: Authoritative policy context and intake prerequisites are being validated.
            payloadSchema:
              type: object
              required:
                - toStatus
                - reason
    - id: decision-policy-resolve
