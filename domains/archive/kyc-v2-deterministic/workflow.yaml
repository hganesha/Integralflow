    - id: acquire-identity
      kind: tool
      name: Identity document verification
      summary: Acquire through wiring:persona:identity.document.verify; write the normalized VerificationRecord records, or an incomplete-check finding when the check established nothing.
      contextSelectorIds:
        - name
        - country
        - dateOfBirth
      capabilities:
        tools:
          - identity.document.verify.v1
      config:
        evidenceCapture:
          type: kyc_acquire_identity
          sourceType: TOOL
          trustTier: VERIFIED_PROVIDER
          instructionTrust: UNTRUSTED_EXTERNAL
        caseWriteActor: system
        caseWritePrincipalId: kyc-connector-normalizer
        caseWrites:
          - commandType: LinkEvidence
            when: output.outcome == "passed"
            payload:
              evidenceId: "{{ evidence.evidenceId }}"
              purpose: KYC_IDENTITY_VERIFICATION
            payloadSchema:
              type: object
              required:
                - evidenceId
                - purpose
          - commandType: LinkEvidence
            when: output.outcome != "passed"
            payload:
              evidenceId: "{{ evidence.evidenceId }}"
              purpose: KYC_IDENTITY_VERIFICATION_ATTEMPT
            payloadSchema:
              type: object
              required:
                - evidenceId
                - purpose
          - commandType: RecordCanonicalRecords
            when: output.records.0
            payload:
              records: "{{ output.records }}"
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
            payloadSchema:
              type: object
              required:
                - records
                - evidenceRefs
          - commandType: RecordScreeningFinding
            when: output.outcome != "passed"
            payload:
              findingId: finding_identity_document_not_verified_acquire_identity_{{ run.runId }}
              findingType: IDENTITY_DOCUMENT_NOT_VERIFIED
              classification: REVIEW
              confidence:
                value: 0.8
                method: connector_outcome
              reason: The identity connector did not positively verify the document (outcome {{ output.outcome }}).
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
              factRefs: []
              policyRelevance: KYC-CIP-001
            payloadSchema:
              type: object
              required:
                - findingId
                - findingType
                - reason
                - evidenceRefs
    - id: acquire-documents
