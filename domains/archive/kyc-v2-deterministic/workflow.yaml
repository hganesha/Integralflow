            when: output.outcome != "BLOCK"
            payload:
              objectRef: case:{{ case.caseId }}
              reason: "Disposition gate requires independent human review: {{ output.reasonCode }}"
              priority: HIGH
              evidenceRefs: []
            payloadSchema:
              type: object
              required:
                - objectRef
                - reason
                - evidenceRefs
