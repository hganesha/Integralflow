                RC-HIGH-INDIVIDUAL: 15552000
                RC-LOW-STANDARD-INDIVIDUAL: 93312000
                RC-SOLE-PROPRIETOR-STANDARD: 93312000
                RC-STANDARD-INDIVIDUAL: 93312000
