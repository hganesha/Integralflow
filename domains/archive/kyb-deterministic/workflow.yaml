    - id: acquire-sanctions
      kind: tool
      name: OpenSanctions sanctions screen
      summary: Acquire through opensanctions:sanctions; write the normalized WatchlistEntry, ScreeningHit or NegativeSearchEvidence records, or an evidence gap when the check established nothing.
      contextSelectorIds:
        - kybSubjects
        - screeningEntities
      capabilities:
        tools:
          - screening.sanctions.v1
      config:
        subjectAcquisition:
          subjectsSelector: kybSubjects
          entitiesSelector: screeningEntities
          maxSubjects: 50
        evidenceCapture:
          type: kyb_acquire_sanctions
          sourceType: TOOL
          trustTier: VERIFIED_PROVIDER
          instructionTrust: UNTRUSTED_EXTERNAL
        caseWriteActor: system
        caseWritePrincipalId: kyb-connector-normalizer
        caseWrites:
          - commandType: LinkEvidence
            payload:
              evidenceId: "{{ evidence.evidenceId }}"
              purpose: KYB_SANCTIONS_SCREENING
            payloadSchema:
              type: object
              required:
                - evidenceId
                - purpose
          - commandType: RecordCanonicalRecords
            when: output.records.0
            payload:
              records: "{{ output.records }}"
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
            payloadSchema:
              type: object
              required:
                - records
                - evidenceRefs
          - commandType: RecordScreeningFinding
            when: output.recordGap
            payload:
              findingId: finding_evidence_gap_acquire_sanctions_{{ run.runId }}
              findingType: EVIDENCE_GAP
              classification: REVIEW
              confidence:
                value: 1
                method: connector_outcome
              reason: "{{ output.recordGap.reason }}"
              evidenceRefs:
                - "{{ evidence.evidenceId }}"
              factRefs: []
              policyRelevance: KYB-EVIDENCE
            payloadSchema:
              type: object
              required:
                - findingId
                - findingType
                - reason
                - evidenceRefs
